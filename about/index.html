<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About the Author | Flathack</title>
  <meta name="description" content="About the author behind the Flathack projects.">
  <link rel="icon" type="image/png" href="../assets/img/icons/flathack_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="tool-theme">
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../index.html">
        <img class="brand-mark" src="../assets/img/icons/flathack_icon.png" alt="" width="44" height="44">
        <span class="brand-text">Flathack Projects</span>
      </a>
      <nav class="project-top-nav" aria-label="Projekt-Navigation"></nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow" data-i18n="eyebrow">About the author</p>
          <h1>Steven Schödel</h1>
          <p class="page-intro" data-i18n="intro">This site is where I present my projects. I build them in my spare time alongside my regular work.</p>
        </div>
        <aside class="panel-card">
          <p class="panel-label" data-i18n="profile">Profile</p>
          <p data-i18n="find_me">You can find me here:</p>
          <div class="section-actions">
            <a class="button button-repo" href="https://www.xing.com/profile/Steven_Schoedel/web_profiles?nwt_nav=profile&expandNeffi=true">Xing Profile</a>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script>
    (function() {
      var I18N = {
        de: {
          eyebrow: '\u00dcber den Autor',
          intro: 'Auf dieser Seite pr\u00e4sentiere ich meine Projekte. Ich entwickle sie in meiner Freizeit neben meiner regul\u00e4ren Arbeit.',
          profile: 'Profil',
          find_me: 'Hier bin ich zu finden:',
        },
        en: {
          eyebrow: 'About the author',
          intro: 'This site is where I present my projects. I build them in my spare time alongside my regular work.',
          profile: 'Profile',
          find_me: 'You can find me here:',
        }
      };
      var lang = (function() { try { return sessionStorage.getItem('flathack-lang') || 'en'; } catch(e) { return 'en'; } })();
      function t(key) { return (I18N[lang] || I18N.de)[key] || key; }
      function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(function(el) { el.textContent = t(el.dataset.i18n); });
      }
      window.addEventListener('lang-change', function(e) {
        if (e.detail && e.detail.lang && e.detail.lang !== lang) { lang = e.detail.lang; applyLang(); }
      });
      if (lang !== 'en') applyLang();
    })();
  </script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
