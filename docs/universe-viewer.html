<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universum | Flathack</title>
  <meta name="description" content="Interaktive Freelancer-Universumskarte: Systeme, Sprungverbindungen, Planeten und Stationen für Hamburg City, Crossfire und weitere Mods.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ── Full-width override ── */
    .site-shell { width: calc(100% - 32px); max-width: none; }

    /* ── Universe viewer container ── */
    .uv-container {
      position: relative;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(6, 14, 26, 0.85);
      overflow: hidden;
      min-height: 600px;
      cursor: grab;
    }
    .uv-container.dragging { cursor: grabbing; }

    .uv-container svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Controls bar ── */
    .uv-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .uv-controls.in-subnav {
      margin: 0 0 0 auto;
      flex: 1 1 420px;
      justify-content: flex-end;
      min-width: 0;
    }
    .uv-controls .uv-field {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .uv-controls input[type="text"] {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(132, 177, 255, 0.2);
      border-radius: 999px;
      background: rgba(6, 14, 26, 0.8);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      min-width: 220px;
      width: min(280px, 100%);
    }
    .uv-controls label {
      display: none;
    }

    .uv-btn {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(132, 177, 255, 0.25);
      border-radius: 999px;
      background: rgba(6, 14, 26, 0.7);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 200ms, border-color 200ms;
      white-space: nowrap;
    }
    .uv-btn:hover {
      background: rgba(88, 196, 255, 0.12);
      border-color: var(--accent);
    }
    .uv-btn.active {
      background: rgba(88, 196, 255, 0.18);
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .uv-zoom-controls {
      display: flex;
      gap: 6px;
    }
    .uv-zoom-controls .uv-btn { min-width: 34px; padding: 0 10px; font-size: 1rem; }

    /* ── Breadcrumb ── */
    .uv-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .uv-breadcrumb a {
      color: var(--accent);
      cursor: pointer;
      transition: color 200ms;
    }
    .uv-breadcrumb a:hover { color: var(--accent-strong); }
    .uv-breadcrumb .separator { opacity: 0.4; }
    .uv-breadcrumb.in-subnav {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    /* ── Info panel (right side overlay) ── */
    .uv-info-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 300px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(8, 18, 32, 0.95);
      backdrop-filter: blur(12px);
      font-size: 0.88rem;
      display: none;
      z-index: 10;
    }
    .uv-info-panel.visible { display: block; }
    .uv-info-panel h3 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      color: var(--accent-strong);
    }
    .uv-info-panel .uv-info-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .uv-info-panel .uv-info-close:hover { color: var(--text); }
    .uv-info-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .uv-info-list li {
      padding: 6px 0;
      border-bottom: 1px solid rgba(132, 177, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .uv-info-list li:last-child { border-bottom: none; }
    .uv-obj-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .uv-obj-label { flex: 1; }
    .uv-obj-type {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
    }
    .uv-info-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(132, 177, 255, 0.12);
    }
    .uv-info-section h4 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .uv-mini-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .uv-mini-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(132, 177, 255, 0.06);
      align-items: start;
    }
    .uv-mini-list li:last-child { border-bottom: none; }
    .uv-mini-list .name {
      color: var(--text);
    }
    .uv-mini-list .meta {
      color: var(--muted);
      font-size: 0.76rem;
      font-family: "IBM Plex Mono", monospace;
      white-space: nowrap;
    }
    .uv-empty-note {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ── Legend ── */
    .uv-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .uv-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .uv-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Stats bar ── */
    .uv-stats {
      display: flex;
      gap: 14px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .uv-stats strong { color: var(--accent-strong); }
    .uv-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      min-width: 0;
    }
    .uv-legend {
      display: none;
    }
    main > h2[data-i18n="title"],
    main > p[data-i18n="subtitle"] {
      display: none;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .uv-info-panel { width: 240px; }
      .uv-controls.in-subnav {
        margin-left: 0;
        justify-content: flex-start;
        flex-basis: 100%;
      }
      .uv-stats {
        order: 10;
        width: 100%;
        white-space: normal;
      }
    }
    @media (max-width: 520px) {
      .uv-info-panel {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 50vh;
        border-radius: 14px 14px 0 0;
      }
      .uv-controls input[type="text"] {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">FH</span>
        <span class="brand-text">Flathack Projects</span>
      </a>
      <nav class="project-top-nav" aria-label="Projekt-Navigation"></nav>
    </header>

    <main>
      <h2 style="margin: 0 0 4px;" data-i18n="title">Universum</h2>
      <p style="color: var(--muted); margin: 0 0 18px; font-size: 0.92rem;" data-i18n="subtitle">Interaktive Karte des Freelancer-Universums — klicke auf ein System für Details.</p>

      <div class="uv-breadcrumb" id="breadcrumb">
        <span data-i18n="bc_universe">Universumskarte</span>
      </div>

      <div class="uv-controls">
        <div class="uv-field">
          <label for="search" data-i18n="lbl_search">Suche</label>
          <input type="text" id="search" placeholder="System oder Objekt suchen…">
        </div>
        <button class="uv-btn active" id="btnShowHoles" title="Jump Holes ein-/ausblenden">Jump Holes</button>
        <div class="uv-zoom-controls">
          <button class="uv-btn" id="btnZoomIn" title="Vergrößern">+</button>
          <button class="uv-btn" id="btnZoomOut" title="Verkleinern">−</button>
          <button class="uv-btn" id="btnZoomReset" title="Zurücksetzen">⌂</button>
        </div>
      </div>

      <div class="uv-stats" id="stats"></div>

      <div class="uv-container" id="viewer">
        <svg id="svgCanvas"></svg>
        <div class="uv-info-panel" id="infoPanel">
          <button class="uv-info-close" id="infoClose">✕</button>
          <h3 id="infoPanelTitle"></h3>
          <ul class="uv-info-list" id="infoPanelList"></ul>
        </div>
      </div>

      <div class="uv-legend" id="legend"></div>

      <footer class="page-footer" style="margin-top: 32px;">
        &copy; 2026 Steven Schödel — Flathack Projects
      </footer>
    </main>
  </div>

  <script>
  (function () {
    "use strict";

    /* ── i18n ── */
    var I18N = {
      de: {
        title: 'Universum',
        subtitle: 'Interaktive Karte des Freelancer-Universums — klicke auf ein System für Details.',
        bc_universe: 'Universumskarte',
        lbl_search: 'Suche',
        search_ph: 'System oder Objekt suchen…',
        btn_holes_title: 'Jump Holes ein-/ausblenden',
        btn_zoomin: 'Vergrößern',
        btn_zoomout: 'Verkleinern',
        btn_zoomreset: 'Zurücksetzen',
        err_load: 'Fehler beim Laden der Daten.',
        err_nosys: 'Keine Systemdaten gefunden.',
        err_noobj: 'Keine Objekte in diesem System.',
        stats_systems: 'Systeme',
        stats_connections: 'Verbindungen',
        stats_objects: 'Objekte',
        legend_station_system: 'System mit Station',
        legend_system: 'System',
        legend_gate: 'Jump Gate Verbindung',
        legend_hole: 'Jump Hole Verbindung',
        legend_buoy: 'Boje',
        info_type: 'Typ',
        info_nick: 'Nickname',
        info_pos: 'Position',
        info_base: 'Basis',
        info_jump: 'Sprung',
        info_rotation: 'Rotation',
        info_commodities_sells: 'Verkauft Commodities',
        info_commodities_buys: 'Kauft Commodities',
        info_ships: 'Schiffe',
        info_none: 'Keine Einträge',
        action_sells: 'Verkauft',
        action_buys: 'Kauft',
      },
      en: {
        title: 'Universe',
        subtitle: 'Interactive map of the Freelancer universe — click a system for details.',
        bc_universe: 'Universe Map',
        lbl_search: 'Search',
        search_ph: 'Search system or object…',
        btn_holes_title: 'Toggle Jump Holes',
        btn_zoomin: 'Zoom in',
        btn_zoomout: 'Zoom out',
        btn_zoomreset: 'Reset',
        err_load: 'Error loading data.',
        err_nosys: 'No system data found.',
        err_noobj: 'No objects in this system.',
        stats_systems: 'Systems',
        stats_connections: 'Connections',
        stats_objects: 'Objects',
        legend_station_system: 'System with station',
        legend_system: 'System',
        legend_gate: 'Jump Gate connection',
        legend_hole: 'Jump Hole connection',
        legend_buoy: 'Buoy',
        info_type: 'Type',
        info_nick: 'Nickname',
        info_pos: 'Position',
        info_base: 'Base',
        info_jump: 'Jump',
        info_rotation: 'Rotation',
        info_commodities_sells: 'Sells commodities',
        info_commodities_buys: 'Buys commodities',
        info_ships: 'Ships',
        info_none: 'No entries',
        action_sells: 'Sells',
        action_buys: 'Buys',
      }
    };

    var TYPE_LABELS_I18N = {
      de: {
        sun: "Sonne", planet: "Planet", jump_gate: "Jump Gate", jump_hole: "Jump Hole",
        station: "Station", dock: "Dock", depot: "Depot", weapons_platform: "Waffenplattform",
        mining: "Mining", nebula: "Nebel", asteroid_field: "Asteroidenfeld",
        death_zone: "Death Zone", trade_lane: "Trade Lane", buoy: "Boje", surprise: "Surprise", other: "Sonstige",
      },
      en: {
        sun: "Sun", planet: "Planet", jump_gate: "Jump Gate", jump_hole: "Jump Hole",
        station: "Station", dock: "Dock", depot: "Depot", weapons_platform: "Weapons Platform",
        mining: "Mining", nebula: "Nebula", asteroid_field: "Asteroid Field",
        death_zone: "Death Zone", trade_lane: "Trade Lane", buoy: "Buoy", surprise: "Surprise", other: "Other",
      }
    };

    var lang = (function() { try { return sessionStorage.getItem('flathack-lang') || 'en'; } catch(e) { return 'en'; } })();
    function t(key) { return (I18N[lang] || I18N.de)[key] || key; }
    function typeLabel(type) { return (TYPE_LABELS_I18N[lang] || TYPE_LABELS_I18N.de)[type] || type; }

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        el.textContent = t(el.dataset.i18n);
      });
      searchInput.placeholder = t('search_ph');
      btnShowHoles.title = t('btn_holes_title');
      btnZoomIn.title = t('btn_zoomin');
      btnZoomOut.title = t('btn_zoomout');
      btnZoomReset.title = t('btn_zoomreset');
      // Re-render current view
      if (viewMode === 'system' && currentSystem) {
        showSystem(currentSystem);
      } else if (data) {
        showUniverse();
      }
    }

    window.addEventListener('lang-change', function(e) {
      if (e.detail && e.detail.lang && e.detail.lang !== lang) {
        lang = e.detail.lang;
        applyLang();
      }
    });

    /* ── Color palette for object types ── */
    var COLORS = {
      sun:              "#FFD700",
      planet:           "#58c4ff",
      jump_gate:        "#34d399",
      jump_hole:        "#a78bfa",
      station:          "#f59e0b",
      dock:             "#94a3b8",
      depot:            "#fb923c",
      weapons_platform: "#ef4444",
      mining:           "#d97706",
      nebula:           "#c084fc",
      asteroid_field:   "#a8763e",
      death_zone:       "#ff7a59",
      trade_lane:       "#38bdf8",
      buoy:             "#facc15",
      surprise:         "#ff0000",
      other:            "#6b7280",
    };

    /* ── State ── */
    var data = null;
    var currentMod = "";
    var viewMode = "universe"; // "universe" or "system"
    var currentSystem = null;
    var showJumpHoles = true;
    var iconCache = {};  // arch -> true/false (whether icon exists)
    var tradeData = null;
    var baseCommodityIndex = {};
    var baseShipIndex = {};

    // Pan & zoom state
    var viewBox = { x: 0, y: 0, w: 1000, h: 800 };
    var isPanning = false;
    var panStart = { x: 0, y: 0 };
    var panViewStart = { x: 0, y: 0 };

    /* ── DOM refs ── */
    var svg = document.getElementById("svgCanvas");
    var viewer = document.getElementById("viewer");
    var infoPanel = document.getElementById("infoPanel");
    var infoPanelTitle = document.getElementById("infoPanelTitle");
    var infoPanelList = document.getElementById("infoPanelList");
    var infoClose = document.getElementById("infoClose");
    var breadcrumb = document.getElementById("breadcrumb");
    var statsEl = document.getElementById("stats");
    var searchInput = document.getElementById("search");
    var legendEl = document.getElementById("legend");
    var controlsEl = document.querySelector(".uv-controls");
    var btnShowHoles = document.getElementById("btnShowHoles");
    var btnZoomIn = document.getElementById("btnZoomIn");
    var btnZoomOut = document.getElementById("btnZoomOut");
    var btnZoomReset = document.getElementById("btnZoomReset");

    /* ── Data loading ── */
    function loadMod(mod) {
      currentMod = mod;
      Promise.all([
        fetch("../data/universe/" + mod + ".json").then(function (r) { return r.json(); }),
        fetch("../data/trade-routes/" + mod + ".json")
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
      ])
        .then(function (results) {
          var d = results[0];
          data = d;
          tradeData = results[1];
          rebuildTradeIndexes();
          iconCache = {};
          var archs = {};
          d.systems.forEach(function (s) {
            (s.objects || []).forEach(function (o) {
              if (o.arch && !archs[o.arch]) archs[o.arch] = true;
            });
          });
          var archList = Object.keys(archs);
          var iconBase = "../data/universe/icons/" + mod + "/";
          var remaining = archList.length;
          if (!remaining) { showUniverse(); return; }
          archList.forEach(function (arch) {
            var img = new window.Image();
            img.onload = function () { iconCache[arch] = true; if (--remaining === 0) showUniverse(); };
            img.onerror = function () { iconCache[arch] = false; if (--remaining === 0) showUniverse(); };
            img.src = iconBase + encodeURIComponent(arch) + ".png";
          });
        })
        .catch(function () {
          svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#ef4444" font-size="16">' + escXml(t('err_load')) + '</text>';
        });
    }

    function rebuildTradeIndexes() {
      baseCommodityIndex = {};
      baseShipIndex = {};
      if (!tradeData) return;

      Object.keys(tradeData.by_commodity || {}).forEach(function (commodityNick) {
        var info = (tradeData.commodities || {})[commodityNick] || {};
        (tradeData.by_commodity[commodityNick] || []).forEach(function (entry) {
          var baseNick = (entry.base || "").toLowerCase();
          if (!baseNick) return;
          if (!baseCommodityIndex[baseNick]) baseCommodityIndex[baseNick] = [];
          baseCommodityIndex[baseNick].push({
            nick: commodityNick,
            name: info.name || commodityNick,
            price: entry.price || 0,
            action: entry.src ? "sells" : "buys"
          });
        });
      });

      Object.keys(baseCommodityIndex).forEach(function (baseNick) {
        baseCommodityIndex[baseNick].sort(function (a, b) {
          if (a.action !== b.action) return a.action === "sells" ? -1 : 1;
          if (b.price !== a.price) return b.price - a.price;
          return a.name.localeCompare(b.name);
        });
      });

      (tradeData.ships || []).forEach(function (ship) {
        (ship.dealers || []).forEach(function (dealer) {
          var baseNick = (dealer.base || "").toLowerCase();
          if (!baseNick) return;
          if (!baseShipIndex[baseNick]) baseShipIndex[baseNick] = [];
          baseShipIndex[baseNick].push({
            nick: ship.nick,
            name: ship.name || ship.nick,
            type: ship.type || "",
            cargo: ship.cargo || 0,
            price: ship.price || 0
          });
        });
      });

      Object.keys(baseShipIndex).forEach(function (baseNick) {
        baseShipIndex[baseNick].sort(function (a, b) {
          if (b.cargo !== a.cargo) return b.cargo - a.cargo;
          if (b.price !== a.price) return b.price - a.price;
          return a.name.localeCompare(b.name);
        });
      });
    }

    /* ── Universe map (all systems) ── */
    function showUniverse() {
      viewMode = "universe";
      currentSystem = null;
      infoPanel.classList.remove("visible");

      if (!data || !data.systems.length) {
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="' + COLORS.other + '" font-size="14">' + escXml(t('err_nosys')) + '</text>';
        return;
      }

      // Compute bounding box of system positions
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      data.systems.forEach(function (s) {
        if (s.pos[0] < minX) minX = s.pos[0];
        if (s.pos[1] < minY) minY = s.pos[1];
        if (s.pos[0] > maxX) maxX = s.pos[0];
        if (s.pos[1] > maxY) maxY = s.pos[1];
      });

      var rangeX = maxX - minX || 1;
      var rangeY = maxY - minY || 1;
      var padding = 80;
      var w = 1200;
      var h = Math.max(800, w * (rangeY / rangeX));
      var scaleX = (w - padding * 2) / rangeX;
      var scaleY = (h - padding * 2) / rangeY;
      var scale = Math.min(scaleX, scaleY);

      // Center offset
      var usedW = rangeX * scale;
      var usedH = rangeY * scale;
      var offX = (w - usedW) / 2;
      var offY = (h - usedH) / 2;

      function mapX(v) { return offX + (v - minX) * scale; }
      function mapY(v) { return offY + (v - minY) * scale; }

      // Build nick -> screen pos lookup
      var sysPos = {};
      data.systems.forEach(function (s) {
        sysPos[s.nick.toUpperCase()] = {
          x: mapX(s.pos[0]),
          y: mapY(s.pos[1]),
          name: s.name,
          nick: s.nick,
          obj: s,
        };
      });

      var lines = "";
      var drawnConn = {};

      // Draw connections
      data.connections.forEach(function (c) {
        var from = sysPos[c.from.toUpperCase()];
        var to = sysPos[c.to.toUpperCase()];
        if (!from || !to) return;

        var key = [c.from, c.to].sort().join("-");
        if (drawnConn[key]) return;
        drawnConn[key] = true;

        var isHole = c.type === "jump_hole";
        if (isHole && !showJumpHoles) return;

        var color = isHole ? COLORS.jump_hole : COLORS.jump_gate;
        var dash = isHole ? ' stroke-dasharray="6,4"' : "";
        var opacity = isHole ? "0.4" : "0.35";
        lines += '<line x1="' + from.x + '" y1="' + from.y + '" x2="' + to.x + '" y2="' + to.y + '"' +
                 ' stroke="' + color + '" stroke-width="1.2" opacity="' + opacity + '"' + dash + '/>';
      });

      var nodes = "";
      data.systems.forEach(function (s) {
        var sp = sysPos[s.nick.toUpperCase()];
        if (!sp) return;

        var objCount = s.objects ? s.objects.length : 0;
        var r = Math.max(5, Math.min(12, 4 + objCount * 0.4));

        // Color based on dominant object types
        var hasStation = false;
        if (s.objects) {
          s.objects.forEach(function (o) {
            if (o.type === "station") hasStation = true;
          });
        }
        var fillColor = hasStation ? COLORS.station : COLORS.planet;

        nodes += '<g class="uv-system-node" data-nick="' + escAttr(s.nick) + '" style="cursor:pointer;">' +
                 '<circle cx="' + sp.x + '" cy="' + sp.y + '" r="' + r + '"' +
                 ' fill="' + fillColor + '" opacity="0.8"' +
                 ' stroke="' + fillColor + '" stroke-width="0.5" stroke-opacity="0.4"/>' +
                 '<circle cx="' + sp.x + '" cy="' + sp.y + '" r="' + (r + 6) + '"' +
                 ' fill="transparent" stroke="transparent"/>' + // hit area
                 '<text x="' + sp.x + '" y="' + (sp.y + r + 14) + '"' +
                 ' text-anchor="middle" fill="#9fb2cf" font-size="9" font-family="Space Grotesk, sans-serif">' +
                 escXml(s.name) + '</text>' +
                 '</g>';
      });

      viewBox = { x: 0, y: 0, w: w, h: h };
      svg.setAttribute("viewBox", viewBox.x + " " + viewBox.y + " " + viewBox.w + " " + viewBox.h);
      svg.innerHTML = '<g id="connections">' + lines + '</g><g id="nodes">' + nodes + '</g>';

      // Adjust container height
      var aspect = h / w;
      viewer.style.height = Math.min(800, viewer.offsetWidth * aspect) + "px";

      // Click handler for system nodes
      svg.querySelectorAll(".uv-system-node").forEach(function (node) {
        node.addEventListener("click", function (e) {
          e.stopPropagation();
          var nick = node.getAttribute("data-nick");
          var sys = data.systems.find(function (s) { return s.nick === nick; });
          if (sys) showSystem(sys);
        });
      });

      // Update breadcrumb
      breadcrumb.innerHTML = '<span>' + escXml(t('bc_universe')) + '</span>';

      // Update stats
      var totalObj = 0;
      data.systems.forEach(function (s) { totalObj += (s.objects ? s.objects.length : 0); });
      statsEl.innerHTML = "Systeme: <strong>" + data.systems.length + "</strong> · " +
                          "Verbindungen: <strong>" + data.connections.length + "</strong> · " +
                          "Objekte: <strong>" + totalObj + "</strong>";

      // Legend
      legendEl.innerHTML =
        legendItem(COLORS.station, t('legend_station_system')) +
        legendItem(COLORS.planet, t('legend_system')) +
        legendItem(COLORS.jump_gate, t('legend_gate')) +
        legendItem(COLORS.jump_hole, t('legend_hole'));
    }

    /* ── System detail view ── */
    function showSystem(sys) {
      viewMode = "system";
      currentSystem = sys;
      infoPanel.classList.remove("visible");

      var objects = sys.objects || [];
      if (!objects.length) {
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="' + COLORS.other + '" font-size="14">' + escXml(t('err_noobj')) + '</text>';
        updateBreadcrumb(sys);
        return;
      }

      // Freelancer nav map grid: 8×8 cells, half_extent = 120000 / NavMapScale
      var gridSize = 8;
      var navmapscale = sys.navmapscale || 1.0;
      var gridRange = 120000 / navmapscale; // half-extent in game units
      var fullRange = gridRange * 2;
      var padding = 60;
      var w = 1000;
      var h = 1000;
      var cellSvg = (w - padding * 2) / gridSize;
      var gridLeft = padding;
      var gridTop = padding;
      var gridW = cellSvg * gridSize;
      var gridH = cellSvg * gridSize;

      function mapObjX(v) { return gridLeft + ((v + gridRange) / fullRange) * gridW; }
      function mapObjZ(v) { return gridTop + ((v + gridRange) / fullRange) * gridH; }

      var content = "";

      // Draw 8×8 grid
      var gridLabels = ["A", "B", "C", "D", "E", "F", "G", "H"];
      for (var gi = 0; gi <= gridSize; gi++) {
        var gx = gridLeft + gi * cellSvg;
        var gy = gridTop + gi * cellSvg;
        // Vertical line
        content += '<line x1="' + gx + '" y1="' + gridTop + '" x2="' + gx + '" y2="' + (gridTop + gridH) + '"' +
                   ' stroke="rgba(132,177,255,0.08)" stroke-width="0.8"/>';
        // Horizontal line
        content += '<line x1="' + gridLeft + '" y1="' + gy + '" x2="' + (gridLeft + gridW) + '" y2="' + gy + '"' +
                   ' stroke="rgba(132,177,255,0.08)" stroke-width="0.8"/>';
      }
      // Grid labels
      for (var gc = 0; gc < gridSize; gc++) {
        // Column labels (A-H) at top
        content += '<text x="' + (gridLeft + gc * cellSvg + cellSvg / 2) + '" y="' + (gridTop - 8) + '"' +
                   ' text-anchor="middle" fill="rgba(132,177,255,0.25)" font-size="10"' +
                   ' font-family="IBM Plex Mono, monospace">' + gridLabels[gc] + '</text>';
        // Row labels (1-8) at left
        content += '<text x="' + (gridLeft - 10) + '" y="' + (gridTop + gc * cellSvg + cellSvg / 2 + 3) + '"' +
                   ' text-anchor="middle" fill="rgba(132,177,255,0.25)" font-size="10"' +
                   ' font-family="IBM Plex Mono, monospace">' + (gc + 1) + '</text>';
      }

      // ── Draw zones (nebulae + asteroid fields) as background ellipses ──
      var zones = sys.zones || [];
      zones.forEach(function (z) {
        if (z.type === "death_zone") return;
        var cx = mapObjX(z.pos[0]);
        var cy = mapObjZ(z.pos[1]);
        var color = COLORS[z.type] || COLORS.other;
        // Map zone size from game units to SVG units
        var rx = (z.size[0] / fullRange) * gridW;
        var ry = (z.size[1] / fullRange) * gridH;
        if (rx < 3) rx = 3;
        if (ry < 3) ry = 3;
        content += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"' +
                   ' fill="' + color + '" opacity="0.08"' +
                   ' stroke="' + color + '" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4,3"/>';
      });

      // ── Draw trade lane polylines ──
      var tradeLanes = sys.trade_lanes || [];
      tradeLanes.forEach(function (chain) {
        if (chain.length < 2) return;
        var points = chain.map(function (p) {
          return mapObjX(p[0]) + "," + mapObjZ(p[1]);
        }).join(" ");
        content += '<polyline points="' + points + '"' +
                   ' fill="none" stroke="' + COLORS.trade_lane + '" stroke-width="1.5"' +
                   ' opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>';
      });

      // ── Draw objects ──
      // Pre-compute icon path base
      var iconBase = "../data/universe/icons/" + currentMod + "/";
      zones.forEach(function (z) {
        if (z.type !== "death_zone" || z.kind !== "sun_death") return;
        var zx = mapObjX(z.pos[0]);
        var zy = mapObjZ(z.pos[1]);
        var zrx = (z.size[0] / fullRange) * gridW;
        var zry = (z.size[1] / fullRange) * gridH;
        if (zrx < 2) zrx = 2;
        if (zry < 2) zry = 2;
        content += '<ellipse cx="' + zx + '" cy="' + zy + '" rx="' + zrx + '" ry="' + zry + '"' +
                   ' fill="none" stroke="' + COLORS.death_zone + '" stroke-width="1"' +
                   ' stroke-opacity="0.7" stroke-dasharray="5,4"/>';
      });

      objects.forEach(function (o) {
        if (o.type === "jump_hole" && !showJumpHoles) return;

        var cx = mapObjX(o.pos[0]);
        var cy = mapObjZ(o.pos[1]);
        var color = COLORS[o.type] || COLORS.other;
        var r = objectVisualRadius(o, fullRange, gridW, gridH);
        var label = o.name || o.nick;
        var hasIcon = o.arch && iconCache[o.arch] !== false && o.type !== "sun" && o.type !== "planet" && o.type !== "buoy";
        var iconSize = objectIconSize(o, r);
        var rotation = objectRotation(o);
        var showLabel = shouldShowLabel(o);

        content += '<g class="uv-obj-node" data-nick="' + escAttr(o.nick) + '" style="cursor:pointer;">';

        if (o.type === "surprise") {
          var s = r + 2;
          content += '<line x1="' + (cx - s) + '" y1="' + (cy - s) + '" x2="' + (cx + s) + '" y2="' + (cy + s) + '"' +
                     ' stroke="' + color + '" stroke-width="3" stroke-linecap="round" opacity="0.9"/>';
          content += '<line x1="' + (cx + s) + '" y1="' + (cy - s) + '" x2="' + (cx - s) + '" y2="' + (cy + s) + '"' +
                     ' stroke="' + color + '" stroke-width="3" stroke-linecap="round" opacity="0.9"/>';
        } else if (o.type === "buoy") {
          content += '<circle cx="' + cx + '" cy="' + cy + '" r="2.2" fill="' + COLORS.buoy + '" opacity="0.95"/>';
        } else if (hasIcon) {
          content += '<image href="' + iconBase + encodeURIComponent(o.arch) + '.png"' +
                     ' x="' + (cx - iconSize / 2) + '" y="' + (cy - iconSize / 2) + '"' +
                     ' width="' + iconSize + '" height="' + iconSize + '"' +
                     ' transform="rotate(' + rotation + ' ' + cx + ' ' + cy + ')"/>';
        } else {
          content += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"' +
                     ' fill="' + color + '" opacity="' + (o.type === "sun" ? "0.88" : "0.85") + '"' +
                     ' stroke="' + color + '" stroke-width="' + (o.type === "sun" || o.type === "planet" ? "0.3" : "0.8") + '"' +
                     ' stroke-opacity="' + (o.type === "sun" || o.type === "planet" ? "0.25" : "0.5") + '"/>';
        }

        // Hit area
        var hitR = hasIcon ? iconSize / 2 + 4 : Math.max(r + 6, 10);
        content += '<circle cx="' + cx + '" cy="' + cy + '" r="' + hitR + '"' +
                   ' fill="transparent"/>';

        // Label
        var labelY = hasIcon ? cy + iconSize / 2 + 12 : cy + r + 14;
        if (showLabel) {
          content += '<text x="' + cx + '" y="' + labelY + '"' +
                     ' text-anchor="middle" fill="#9fb2cf" font-size="9" font-family="Space Grotesk, sans-serif">' +
                     escXml(label) + '</text>';
        }

        // Goto indicator for jump gates/holes
        if (o.goto) {
          var targetSys = data.systems.find(function (s) { return s.nick.toUpperCase() === o.goto.toUpperCase(); });
          var targetName = targetSys ? targetSys.name : o.goto;
          content += '<text x="' + cx + '" y="' + (labelY + 10) + '"' +
                     ' text-anchor="middle" fill="' + color + '" font-size="7.5" opacity="0.7"' +
                     ' font-family="IBM Plex Mono, monospace">→ ' + escXml(targetName) + '</text>';
        }

        content += '</g>';
      });

      viewBox = { x: 0, y: 0, w: w, h: h };
      svg.setAttribute("viewBox", viewBox.x + " " + viewBox.y + " " + viewBox.w + " " + viewBox.h);
      svg.innerHTML = content;

      viewer.style.height = Math.min(900, viewer.offsetWidth) + "px";

      // Click handler for objects
      svg.querySelectorAll(".uv-obj-node").forEach(function (node) {
        node.addEventListener("click", function (e) {
          e.stopPropagation();
          var nick = node.getAttribute("data-nick");
          var obj = objects.find(function (o) { return o.nick === nick; });
          if (obj) showObjectInfo(obj);
        });
      });

      updateBreadcrumb(sys);

      // Stats for this system
      var typeCounts = {};
      objects.forEach(function (o) {
        typeCounts[o.type] = (typeCounts[o.type] || 0) + 1;
      });
      if (tradeLanes.length) typeCounts["trade_lane"] = tradeLanes.length;
      zones.forEach(function (z) {
        typeCounts[z.type] = (typeCounts[z.type] || 0) + 1;
      });
      var statParts = [];
      Object.keys(typeCounts).forEach(function (t) {
        statParts.push(typeLabel(t) + ": <strong>" + typeCounts[t] + "</strong>");
      });
      statsEl.innerHTML = statParts.join(" · ");

      // Legend for this system
      var typesUsed = Object.keys(typeCounts);
      legendEl.innerHTML = typesUsed.map(function (t) {
        return legendItem(COLORS[t] || COLORS.other, typeLabel(t));
      }).join("");
    }

    /* ── Object info panel ── */
    function showObjectInfo(obj) {
      infoPanelTitle.textContent = obj.name || obj.nick;
      var items = '';
      items += infoRow(t('info_type'), typeLabel(obj.type), COLORS[obj.type]);
      items += infoRow(t('info_nick'), obj.nick);
      items += infoRow(t('info_pos'), Math.round(obj.pos[0]) + ", " + Math.round(obj.pos[1]));
      if (obj.base) items += infoRow(t('info_base'), obj.base);
      if (typeof obj.rotate === "number" && obj.rotate) items += infoRow(t('info_rotation'), Math.round(obj.rotate) + " deg");
      if (obj.goto) {
        var targetSys = data.systems.find(function (s) { return s.nick.toUpperCase() === obj.goto.toUpperCase(); });
        var gotoLabel = targetSys ? targetSys.name : obj.goto;
        items += '<li style="cursor:pointer;color:var(--accent);" data-goto="' + escAttr(obj.goto) + '">' +
                 '<span class="uv-obj-icon" style="background:' + (COLORS[obj.type] || COLORS.other) + ';"></span>' +
                 '<span class="uv-obj-label">→ ' + escXml(gotoLabel) + '</span>' +
                 '<span class="uv-obj-type">' + t('info_jump') + '</span></li>';
      }
      if (obj.base) items += renderBaseTradeSections(obj.base);
      infoPanelList.innerHTML = items;
      infoPanel.classList.add("visible");

      // Goto click
      infoPanelList.querySelectorAll("[data-goto]").forEach(function (el) {
        el.addEventListener("click", function () {
          var target = el.getAttribute("data-goto");
          var sys = data.systems.find(function (s) { return s.nick.toUpperCase() === target.toUpperCase(); });
          if (sys) showSystem(sys);
        });
      });
    }

    function infoRow(label, value, color) {
      return '<li>' +
             (color ? '<span class="uv-obj-icon" style="background:' + color + ';"></span>' : '') +
             '<span class="uv-obj-label">' + escXml(value) + '</span>' +
             '<span class="uv-obj-type">' + escXml(label) + '</span></li>';
    }

    /* ── Breadcrumb ── */
    function renderBaseTradeSections(baseNick) {
      var baseKey = (baseNick || "").toLowerCase();
      var entries = baseCommodityIndex[baseKey] || [];
      var ships = baseShipIndex[baseKey] || [];
      var sells = entries.filter(function (entry) { return entry.action === "sells"; });
      var buys = entries.filter(function (entry) { return entry.action === "buys"; });
      var html = "";
      html += renderInfoSection(t('info_commodities_sells'), sells.map(function (entry) {
        return { name: entry.name, meta: fmtNum(entry.price) + " | " + t('action_sells') };
      }));
      html += renderInfoSection(t('info_commodities_buys'), buys.map(function (entry) {
        return { name: entry.name, meta: fmtNum(entry.price) + " | " + t('action_buys') };
      }));
      html += renderInfoSection(t('info_ships'), ships.map(function (ship) {
        var meta = [];
        if (ship.type) meta.push(ship.type);
        if (ship.cargo) meta.push("Cargo " + fmtNum(ship.cargo));
        if (ship.price) meta.push(fmtNum(ship.price));
        return { name: ship.name, meta: meta.join(" | ") };
      }));
      return html;
    }

    function renderInfoSection(title, rows) {
      var html = '<li class="uv-info-section"><div style="width:100%;">' +
        '<h4>' + escXml(title) + '</h4>';
      if (!rows.length) {
        html += '<div class="uv-empty-note">' + escXml(t('info_none')) + '</div>';
      } else {
        html += '<ul class="uv-mini-list">';
        rows.forEach(function (row) {
          html += '<li><span class="name">' + escXml(row.name) + '</span><span class="meta">' + escXml(row.meta || "") + '</span></li>';
        });
        html += '</ul>';
      }
      html += '</div></li>';
      return html;
    }

    function updateBreadcrumb(sys) {
      breadcrumb.innerHTML =
        '<a id="bcUniverse">' + escXml(t('bc_universe')) + '</a>' +
        '<span class="separator">›</span>' +
        '<span>' + escXml(sys.name) + '</span>';
      document.getElementById("bcUniverse").addEventListener("click", function () {
        showUniverse();
      });
    }

    /* ── Pan & Zoom ── */
    viewer.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      isPanning = true;
      panStart = { x: e.clientX, y: e.clientY };
      panViewStart = { x: viewBox.x, y: viewBox.y };
      viewer.classList.add("dragging");
    });

    window.addEventListener("mousemove", function (e) {
      if (!isPanning) return;
      var rect = viewer.getBoundingClientRect();
      var scaleFactorX = viewBox.w / rect.width;
      var scaleFactorY = viewBox.h / rect.height;
      viewBox.x = panViewStart.x - (e.clientX - panStart.x) * scaleFactorX;
      viewBox.y = panViewStart.y - (e.clientY - panStart.y) * scaleFactorY;
      applyViewBox();
    });

    window.addEventListener("mouseup", function () {
      isPanning = false;
      viewer.classList.remove("dragging");
    });

    viewer.addEventListener("wheel", function (e) {
      e.preventDefault();
      var factor = e.deltaY > 0 ? 1.15 : 0.87;
      zoom(factor, e.clientX, e.clientY);
    }, { passive: false });

    btnZoomIn.addEventListener("click", function () {
      var rect = viewer.getBoundingClientRect();
      zoom(0.75, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
    btnZoomOut.addEventListener("click", function () {
      var rect = viewer.getBoundingClientRect();
      zoom(1.35, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
    btnZoomReset.addEventListener("click", function () {
      if (viewMode === "system" && currentSystem) {
        showSystem(currentSystem);
      } else {
        showUniverse();
      }
    });

    function zoom(factor, clientX, clientY) {
      var rect = viewer.getBoundingClientRect();
      var mx = ((clientX - rect.left) / rect.width) * viewBox.w + viewBox.x;
      var my = ((clientY - rect.top) / rect.height) * viewBox.h + viewBox.y;

      var newW = viewBox.w * factor;
      var newH = viewBox.h * factor;

      viewBox.x = mx - (mx - viewBox.x) * factor;
      viewBox.y = my - (my - viewBox.y) * factor;
      viewBox.w = newW;
      viewBox.h = newH;
      applyViewBox();
    }

    function applyViewBox() {
      svg.setAttribute("viewBox", viewBox.x + " " + viewBox.y + " " + viewBox.w + " " + viewBox.h);
    }

    /* ── Search ── */
    var searchTimeout;
    searchInput.addEventListener("input", function () {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(doSearch, 300);
    });

    function doSearch() {
      var q = searchInput.value.trim().toLowerCase();
      if (!q || !data) {
        // Reset highlights
        svg.querySelectorAll(".uv-search-highlight").forEach(function (el) { el.remove(); });
        return;
      }

      // Search in systems
      if (viewMode === "universe") {
        svg.querySelectorAll(".uv-system-node").forEach(function (node) {
          var nick = node.getAttribute("data-nick");
          var sys = data.systems.find(function (s) { return s.nick === nick; });
          if (!sys) return;
          var match = sys.name.toLowerCase().indexOf(q) >= 0 || sys.nick.toLowerCase().indexOf(q) >= 0;
          // Also search in objects
          if (!match && sys.objects) {
            match = sys.objects.some(function (o) {
              return (o.name && o.name.toLowerCase().indexOf(q) >= 0) ||
                     o.nick.toLowerCase().indexOf(q) >= 0;
            });
          }
          node.style.opacity = match ? "1" : "0.15";
        });
        svg.querySelectorAll("#connections line").forEach(function (line) {
          line.style.opacity = "0.08";
        });
      } else {
        // System view: highlight matching objects
        svg.querySelectorAll(".uv-obj-node").forEach(function (node) {
          var nick = node.getAttribute("data-nick");
          var obj = currentSystem.objects.find(function (o) { return o.nick === nick; });
          if (!obj) return;
          var match = (obj.name && obj.name.toLowerCase().indexOf(q) >= 0) ||
                      obj.nick.toLowerCase().indexOf(q) >= 0 ||
                      (typeLabel(obj.type) || "").toLowerCase().indexOf(q) >= 0;
          node.style.opacity = match ? "1" : "0.15";
        });
      }
    }

    // Clear search highlights when search is emptied
    searchInput.addEventListener("change", function () {
      if (!searchInput.value.trim()) {
        svg.querySelectorAll(".uv-system-node, .uv-obj-node").forEach(function (n) { n.style.opacity = "1"; });
        svg.querySelectorAll("#connections line").forEach(function (l) { l.style.opacity = ""; });
      }
    });

    /* ── Jump Holes toggle ── */
    btnShowHoles.addEventListener("click", function () {
      showJumpHoles = !showJumpHoles;
      btnShowHoles.classList.toggle("active", showJumpHoles);
      if (viewMode === "system" && currentSystem) {
        showSystem(currentSystem);
      } else {
        showUniverse();
      }
    });

    /* ── Info panel close ── */
    infoClose.addEventListener("click", function () {
      infoPanel.classList.remove("visible");
    });

    /* ── Helpers ── */
    function fmtNum(value) {
      return new Intl.NumberFormat(lang === "de" ? "de-DE" : "en-US").format(Math.round(value || 0));
    }

    function objectVisualRadius(obj, fullRange, gridW, gridH) {
      if (obj.radius && (obj.type === "sun" || obj.type === "planet")) {
        var mapped = (obj.radius / fullRange) * Math.min(gridW, gridH);
        return Math.max(2, mapped);
      }
      switch (obj.type) {
        case "sun": return 7;
        case "planet": return 5;
        case "station": return 5;
        case "jump_gate": return 5;
        case "jump_hole": return 4.5;
        case "dock": return 3;
        case "depot": return 3.5;
        case "weapons_platform": return 4;
        case "buoy": return 2.2;
        default: return 3.5;
      }
    }

    function objectIconSize(obj, radius) {
      switch (obj.type) {
        case "jump_gate": return Math.max(16, radius * 2.3);
        case "jump_hole": return Math.max(14, radius * 2.2);
        case "station": return Math.max(14, radius * 2.5);
        case "dock": return Math.max(10, radius * 2.2);
        case "depot": return Math.max(11, radius * 2.2);
        case "weapons_platform": return Math.max(12, radius * 2.2);
        default: return Math.max(12, radius * 2.2);
      }
    }

    function objectRotation(obj) {
      if (typeof obj.rotate !== "number") return 0;
      return 90 - obj.rotate;
    }

    function shouldShowLabel(obj) {
      return obj.type === "planet" || obj.type === "jump_gate" || obj.type === "jump_hole" ||
        (obj.type === "station" && !!obj.base);
    }

    function mountControlsIntoSubnav() {
      var subNav = document.querySelector(".project-sub-nav");
      if (!subNav || !controlsEl || !breadcrumb || !statsEl) return;

      breadcrumb.classList.add("in-subnav");
      controlsEl.classList.add("in-subnav");

      if (!controlsEl.contains(statsEl)) {
        controlsEl.insertBefore(statsEl, controlsEl.querySelector(".uv-zoom-controls"));
      }
      if (!subNav.contains(breadcrumb)) {
        subNav.appendChild(breadcrumb);
      }
      if (!subNav.contains(controlsEl)) {
        subNav.appendChild(controlsEl);
      }
    }

    function legendItem(color, label) {
      return '<div class="uv-legend-item">' +
             '<span class="uv-legend-dot" style="background:' + color + ';"></span>' +
             '<span>' + escXml(label) + '</span></div>';
    }

    function escXml(s) {
      if (!s) return "";
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escAttr(s) {
      return escXml(s);
    }

    /* ── Init ── */
    window.addEventListener("mod-change", function (e) { loadMod(e.detail.mod); });
    window.addEventListener("load", mountControlsIntoSubnav);
    if (lang !== 'de') applyLang();
  })();
  </script>
