<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Route Calculator | Flathack</title>
  <meta name="description" content="Find the most profitable Freelancer trade routes across systems for Hamburg City, Crossfire, and more.">
  <link rel="icon" type="image/png" href="../assets/img/icons/flathack_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ── Full-width override ───────────────────────────── */
    .site-shell {
      width: calc(100% - 32px);
      max-width: none;
    }

    /* ── Trade Route Controls ──────────────────────────── */
    .tr-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .tr-controls-section {
      overflow: visible;
    }
    .tr-reboot-status {
      display: none;
      margin: 6px 0 14px;
      padding: 12px 14px;
      border: 1px solid rgba(88, 196, 255, 0.22);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(8, 20, 34, 0.82), rgba(6, 14, 26, 0.92));
      gap: 6px;
    }
    .tr-reboot-status.active {
      display: grid;
    }
    .tr-reboot-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .tr-reboot-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .tr-reboot-countdown {
      font-family: "IBM Plex Mono", monospace;
      color: var(--accent-strong);
      font-size: 0.88rem;
    }
    .tr-reboot-note,
    .tr-reboot-message {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.5;
    }
    .tr-reboot-message {
      color: #ffd08c;
    }
    .tr-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tr-field label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .tr-field select,
    .tr-field input[type="text"],
    .tr-field input[type="number"] {
      background: rgba(4, 14, 23, 0.85);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      min-width: 100px;
      min-height: 34px;
    }
    .tr-field select { min-width: 170px; }
    .tr-field input[type="text"] { min-width: 220px; }
    .tr-field input[type="number"] { width: 80px; }
    .tr-field select:focus,
    .tr-field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 196, 255, 0.15);
    }
    .tr-field input[type="hidden"] {
      display: none;
    }
    .tr-calendar-field {
      position: relative;
      min-width: 220px;
      z-index: 8;
    }
    .tr-calendar-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(4, 14, 23, 0.85);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .tr-calendar-toggle:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 196, 255, 0.15);
    }
    .tr-calendar-toggle[aria-expanded="true"] {
      border-color: rgba(88, 196, 255, 0.32);
      background: rgba(88, 196, 255, 0.08);
    }
    .tr-calendar-toggle-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .tr-calendar-value {
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tr-calendar-meta {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tr-calendar-toggle-icon {
      color: var(--muted);
      font-size: 0.78rem;
      flex: 0 0 auto;
    }
    .tr-calendar-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 30;
      width: min(320px, calc(100vw - 48px));
      padding: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(6, 14, 26, 0.98);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.34);
    }
    .tr-calendar-panel.open {
      display: grid;
      gap: 10px;
    }
    .tr-calendar-header {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 32px;
      gap: 8px;
      align-items: center;
    }
    .tr-calendar-month {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .tr-calendar-nav {
      min-width: 32px;
      min-height: 32px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(8, 20, 34, 0.7);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .tr-calendar-weekdays,
    .tr-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .tr-calendar-weekdays span {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tr-calendar-day {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid rgba(132, 177, 255, 0.14);
      border-radius: 10px;
      background: rgba(8, 20, 34, 0.72);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
    }
    button.tr-calendar-day {
      cursor: pointer;
    }
    button.tr-calendar-day:hover,
    button.tr-calendar-day:focus-visible {
      outline: none;
      border-color: rgba(88, 196, 255, 0.34);
      background: rgba(88, 196, 255, 0.08);
    }
    .tr-calendar-day.selected {
      border-color: rgba(88, 196, 255, 0.42);
      background: rgba(88, 196, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(88, 196, 255, 0.18);
    }
    .tr-calendar-day.latest {
      box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.22);
    }
    .tr-calendar-day.history {
      border-color: rgba(74, 222, 128, 0.26);
      background: rgba(24, 84, 62, 0.26);
    }
    .tr-calendar-day.repeat {
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.3);
    }
    .tr-calendar-day.gap {
      border-style: dashed;
      border-color: rgba(245, 158, 11, 0.28);
      background: rgba(245, 158, 11, 0.05);
      color: var(--muted);
    }
    .tr-calendar-day.future {
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.24);
      background: rgba(148, 163, 184, 0.08);
      color: rgba(237, 243, 255, 0.55);
    }
    .tr-calendar-day.outside {
      opacity: 0.28;
    }
    .tr-calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .tr-calendar-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tr-calendar-legend i {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(132, 177, 255, 0.2);
      background: rgba(8, 20, 34, 0.72);
    }
    .tr-calendar-legend .is-dataset { background: rgba(88, 196, 255, 0.18); border-color: rgba(88, 196, 255, 0.32); }
    .tr-calendar-legend .is-history { background: rgba(24, 84, 62, 0.34); border-color: rgba(74, 222, 128, 0.26); }
    .tr-calendar-legend .is-repeat { background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.4); }
    .tr-calendar-legend .is-gap { background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.28); }

    /* ── Tabs ──────────────────────────────────────────── */
    .tr-tabs {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .tr-tab {
      padding: 6px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(7, 16, 29, 0.72);
      color: var(--muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tr-tab:hover { color: var(--text); background: rgba(88, 196, 255, 0.08); }
    .tr-tab.active {
      color: var(--text);
      background: rgba(88, 196, 255, 0.14);
      border-color: rgba(88, 196, 255, 0.3);
    }

    .tr-dataset-timeline {
      display: none;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(6, 14, 26, 0.68);
    }
    .tr-dataset-timeline.active {
      display: grid;
    }
    .tr-dataset-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .tr-dataset-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .tr-dataset-title strong {
      font-size: 0.88rem;
      color: var(--text);
    }
    .tr-dataset-title span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .tr-dataset-nav {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .tr-dataset-nav-btn {
      min-width: 34px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(8, 20, 34, 0.7);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tr-dataset-nav-btn:hover:not(:disabled) {
      border-color: rgba(88, 196, 255, 0.32);
      background: rgba(88, 196, 255, 0.1);
    }
    .tr-dataset-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .tr-dataset-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(56px, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }
    .tr-dataset-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 58px;
      padding: 8px 6px;
      border: 1px solid rgba(132, 177, 255, 0.14);
      border-radius: 12px;
      background: rgba(8, 20, 34, 0.72);
      color: var(--text);
      font-family: inherit;
      text-align: center;
    }
    button.tr-dataset-day {
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    button.tr-dataset-day:hover,
    button.tr-dataset-day:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(88, 196, 255, 0.34);
      background: rgba(88, 196, 255, 0.08);
      outline: none;
    }
    .tr-dataset-day.active {
      border-color: rgba(88, 196, 255, 0.42);
      background: rgba(88, 196, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(88, 196, 255, 0.18);
    }
    .tr-dataset-day.is-latest {
      box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.22);
      border-color: rgba(74, 222, 128, 0.32);
    }
    .tr-dataset-day.missing {
      border-style: dashed;
      border-color: rgba(245, 158, 11, 0.28);
      background: rgba(245, 158, 11, 0.05);
      color: var(--muted);
    }
    .tr-dataset-day.future {
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.24);
      background: rgba(148, 163, 184, 0.08);
      color: rgba(237, 243, 255, 0.55);
    }
    .tr-dataset-day.history {
      border-color: rgba(74, 222, 128, 0.26);
      background: rgba(24, 84, 62, 0.26);
      color: #ddfff0;
    }
    .tr-dataset-day.is-repeat {
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.3);
    }
    .tr-dataset-day.gap {
      background: rgba(36, 45, 61, 0.52);
    }
    .tr-dataset-day .day-num {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1;
    }
    .tr-dataset-day .day-meta {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tr-dataset-day.active .day-meta,
    .tr-dataset-day.is-latest .day-meta {
      color: var(--text);
    }
    .tr-dataset-day .day-state {
      font-size: 0.62rem;
      color: rgba(237, 243, 255, 0.72);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tr-dataset-day.is-repeat .day-state {
      color: #ffd27a;
    }
    .tr-dataset-summary {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Stats Bar ────────────────────────────────────── */
    .tr-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .tr-stats strong { color: var(--accent-strong); }
    .tr-results-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .tr-results-summary {
      font-size: 0.84rem;
      color: var(--muted);
    }

    /* ── Search ────────────────────────────────────────── */
    .tr-search {
      width: 100%;
      padding: 7px 14px;
      margin-bottom: 10px;
      background: rgba(4, 14, 23, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .tr-search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .tr-search::placeholder { color: rgba(159, 178, 207, 0.5); }

    /* ── Table ─────────────────────────────────────────── */
    .tr-table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
    }
    .tr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .tr-table th {
      position: sticky;
      top: 0;
      padding: 6px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      background: rgba(8, 20, 34, 0.95);
      border-bottom: 1px solid var(--panel-border);
      cursor: pointer;
      user-select: none;
    }
    .tr-table th:hover { color: var(--text); }
    .tr-table th .sort-arrow { margin-left: 4px; font-size: 0.7rem; }
    .tr-table td {
      padding: 2px 5px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.08);
    }
    .tr-base-cell {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
      line-height: 1.25;
    }
    .tr-base-name,
    .tr-base-system {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tr-base-name {
      color: var(--text);
    }
    .tr-base-system {
      display: none;
      color: var(--muted);
      font-size: 0.76rem;
      white-space: normal;
    }
    .tr-table tbody tr:nth-child(even) { background: rgba(4, 14, 23, 0.35); }
    .tr-table tbody tr:hover { background: rgba(88, 196, 255, 0.06); }

    .td-num { text-align: right; font-family: "IBM Plex Mono", monospace; }
    .td-profit { color: var(--success); font-weight: 600; }
    .td-jumps { color: var(--accent-warm); }
    .tr-table tbody tr.tr-route-parent { cursor: pointer; }
    .tr-path-row { display: none; }
    .tr-path-row.open { display: table-row; }
    .tr-path-row td { padding: 4px 12px 8px; border-bottom: 1px solid rgba(132, 177, 255, 0.08); font-size: 0.84rem; color: var(--muted); }
    .tr-path-summary { margin-bottom: 6px; }
    .tr-path-segments {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .tr-path-segment {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: baseline;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(88, 196, 255, 0.03);
    }
    .tr-path-segment strong { color: var(--accent-strong); }
    .tr-path-segment-time {
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      white-space: nowrap;
    }

    /* ── Round trip legs ───────────────────────────────── */
    .tr-loop-legs {
      display: none;
      padding: 0;
    }
    .tr-loop-legs.open { display: table-row; }
    .tr-loop-legs td {
      padding: 0 8px 5px 9px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.08);
    }
    .tr-leg-detail {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 0.84rem;
      color: var(--muted);
      padding: 6px 0;
    }
    .tr-leg-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .tr-leg-row:nth-child(odd) { background: rgba(88, 196, 255, 0.03); }
    .tr-leg-label { font-weight: 600; color: var(--accent); white-space: nowrap; }
    .tr-leg-info { color: var(--muted); }
    .tr-leg-info .leg-commodity { color: var(--text); font-weight: 500; }
    .tr-leg-info .leg-route { color: var(--muted); }
    .tr-leg-info .leg-jumps { color: var(--accent-warm); font-size: 0.8rem; }
    .tr-leg-info .leg-time { color: var(--accent); font-size: 0.8rem; font-family: "IBM Plex Mono", monospace; }
    .tr-leg-profit { color: var(--success); font-weight: 600; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }

    .tr-commodity-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .tr-commodity-btn:hover { color: var(--text); }

    .tr-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(3, 10, 18, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1200;
    }
    .tr-modal.open { display: flex; }
    .tr-modal-card {
      width: min(1120px, 100%);
      max-height: min(86vh, 900px);
      overflow: auto;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(8, 20, 34, 0.98), rgba(4, 14, 23, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .tr-modal-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 10px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.1);
    }
    .tr-modal-head h3 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }
    .tr-modal-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .tr-modal-close {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .tr-modal-close:hover { background: rgba(88, 196, 255, 0.08); }
    .tr-modal-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 20px 12px;
    }
    .tr-modal-body {
      padding: 0 20px 20px;
    }
    .tr-role-pill {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .tr-role-pill.sell {
      background: rgba(70, 190, 120, 0.12);
      color: #84f0b0;
    }
    .tr-role-pill.buy {
      background: rgba(255, 180, 70, 0.12);
      color: #ffd08c;
    }

    /* ── Loading ───────────────────────────────────────── */
    .tr-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 48px 0;
    }
    .tr-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ───────────────────────────────────── */
    .tr-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* ── Calc button ───────────────────────────────────── */
    .tr-calc-btn {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 16px;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: #04111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      transition: 160ms ease;
    }
    .tr-calc-btn:hover { filter: brightness(1.1); }
    .tr-calc-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Language toggle ─────────────────────────────── */
    .tr-lang-toggle {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      overflow: hidden;
      margin-left: auto;
    }
    .tr-lang-btn {
      padding: 5px 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tr-lang-btn.active {
      background: rgba(88, 196, 255, 0.14);
      color: var(--text);
    }

    /* ── Checkbox ───────────────────────────────────────── */
    .tr-check {
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: center;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      user-select: none;
    }
    .tr-check input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px; height: 16px;
      cursor: pointer;
    }
    .tr-check:hover { color: var(--text); }

    .td-time { color: var(--accent); }
    .td-ppm { color: #f0c040; font-weight: 600; }

    html[data-theme="light"] .tr-reboot-status,
    html[data-theme="light"] .tr-dataset-timeline,
    html[data-theme="light"] .tr-modal-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 249, 254, 0.94));
      box-shadow: var(--shadow);
    }

    html[data-theme="light"] .tr-field select,
    html[data-theme="light"] .tr-field input[type="number"],
    html[data-theme="light"] .tr-calendar-toggle,
    html[data-theme="light"] .tr-search,
    html[data-theme="light"] .tr-modal-close,
    html[data-theme="light"] .tr-lang-btn {
      background: rgba(255, 255, 255, 0.86);
      border-color: var(--panel-border);
      color: var(--text);
    }

    html[data-theme="light"] .tr-calendar-toggle[aria-expanded="true"],
    html[data-theme="light"] .tr-tab.active,
    html[data-theme="light"] .tr-lang-btn.active {
      background: rgba(0, 119, 182, 0.1);
      border-color: rgba(0, 119, 182, 0.24);
      color: var(--text);
    }

    html[data-theme="light"] .tr-calendar-panel {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 20px 48px rgba(37, 63, 93, 0.18);
    }

    html[data-theme="light"] .tr-calendar-nav,
    html[data-theme="light"] .tr-calendar-day,
    html[data-theme="light"] .tr-calendar-legend i,
    html[data-theme="light"] .tr-tab,
    html[data-theme="light"] .tr-dataset-nav-btn,
    html[data-theme="light"] .tr-dataset-day {
      background: rgba(255, 255, 255, 0.78);
      border-color: var(--panel-border);
      color: var(--text);
    }

    html[data-theme="light"] button.tr-calendar-day:hover,
    html[data-theme="light"] button.tr-calendar-day:focus-visible,
    html[data-theme="light"] button.tr-dataset-day:hover,
    html[data-theme="light"] button.tr-dataset-day:focus-visible,
    html[data-theme="light"] .tr-dataset-nav-btn:hover:not(:disabled),
    html[data-theme="light"] .tr-tab:hover,
    html[data-theme="light"] .tr-modal-close:hover {
      background: rgba(0, 119, 182, 0.08);
      border-color: rgba(0, 119, 182, 0.22);
      color: var(--text);
    }

    html[data-theme="light"] .tr-calendar-day.selected,
    html[data-theme="light"] .tr-dataset-day.active {
      background: rgba(0, 119, 182, 0.12);
      border-color: rgba(0, 119, 182, 0.3);
      color: var(--text);
    }

    html[data-theme="light"] .tr-calendar-day.history,
    html[data-theme="light"] .tr-dataset-day.history {
      background: rgba(4, 120, 87, 0.1);
      border-color: rgba(4, 120, 87, 0.22);
      color: var(--success);
    }

    html[data-theme="light"] .tr-calendar-day.future,
    html[data-theme="light"] .tr-dataset-day.future,
    html[data-theme="light"] .tr-calendar-day.gap,
    html[data-theme="light"] .tr-dataset-day.missing,
    html[data-theme="light"] .tr-dataset-day.gap {
      background: rgba(148, 163, 184, 0.12);
      color: var(--muted);
    }

    html[data-theme="light"] .tr-table-wrap {
      background: rgba(255, 255, 255, 0.78);
    }

    html[data-theme="light"] .tr-table th {
      background: rgba(236, 244, 252, 0.98);
      color: var(--accent-strong);
      border-bottom-color: var(--panel-border);
    }

    html[data-theme="light"] .tr-table tbody tr:nth-child(even) {
      background: rgba(226, 237, 248, 0.42);
    }

    html[data-theme="light"] .tr-table tbody tr:hover,
    html[data-theme="light"] .tr-leg-row:nth-child(odd),
    html[data-theme="light"] .tr-path-segment {
      background: rgba(0, 119, 182, 0.06);
    }

    html[data-theme="light"] .tr-modal {
      background: rgba(226, 237, 248, 0.72);
    }

    html[data-theme="light"] .tr-role-pill.sell {
      background: rgba(4, 120, 87, 0.1);
      color: var(--success);
    }

    html[data-theme="light"] .tr-role-pill.buy {
      background: rgba(180, 83, 9, 0.1);
      color: var(--accent-warm);
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 1180px) {
      .tr-table :is(.tr-priority-5) { display: none; }
    }

    @media (max-width: 980px) {
      .tr-table :is(.tr-priority-4) { display: none; }
    }

    @media (max-width: 820px) {
      .tr-table :is(.tr-col-src-sys, .tr-col-dst-sys, .tr-priority-3) { display: none; }
      .tr-base-system { display: block; }
      .tr-table-wrap { overflow-x: hidden; }
      .tr-table,
      .tr-table thead,
      .tr-table tbody {
        display: block;
        width: 100%;
      }
      .tr-table thead tr,
      .tr-table tbody tr.tr-route-parent,
      .tr-table tbody tr.tr-loop-parent {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(82px, 0.75fr) 78px;
        width: 100%;
      }
      .tr-table .tr-col-buy-base { grid-column: 1; }
      .tr-table .tr-col-sell-base { grid-column: 2; }
      .tr-table .tr-col-commodity { grid-column: 3; }
      .tr-table .tr-col-profit-per-min { grid-column: 4; }
      .tr-base-name {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .tr-path-row.open,
      .tr-loop-legs.open {
        display: block;
      }
      .tr-path-row td,
      .tr-loop-legs td {
        display: block;
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      .site-shell { width: calc(100% - 16px); }
      .tr-controls { flex-direction: column; align-items: stretch; }
      .tr-field select, .tr-field input[type="number"] { min-width: unset; width: 100%; }
      .tr-calendar-field { min-width: unset; }
      .tr-calendar-panel { width: 100%; }
      .tr-tabs { flex-wrap: wrap; }
      .tr-dataset-strip { grid-auto-columns: minmax(62px, 62px); }
      .tr-table-wrap { border-radius: 10px; }
      .tr-table {
        font-size: 0.78rem;
        white-space: normal;
      }
      .tr-table th {
        padding: 6px 5px;
        font-size: 0.66rem;
        letter-spacing: 0.03em;
      }
      .tr-table td {
        padding: 5px;
        vertical-align: top;
      }
      .tr-table .tr-col-profit-per-min { text-align: right; }
      .tr-commodity-btn {
        white-space: normal;
        text-align: left;
      }
      .tr-path-row td,
      .tr-loop-legs td {
        padding: 6px 8px 8px;
      }
    }

    @media (max-width: 520px) {
      .tr-table :is(.tr-priority-2) { display: none; }
      .tr-table thead tr,
      .tr-table tbody tr.tr-route-parent,
      .tr-table tbody tr.tr-loop-parent {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 74px;
      }
      .tr-table .tr-col-profit-per-min { grid-column: 3; }
      .tr-table {
        font-size: 0.74rem;
      }
      .tr-table th,
      .tr-table td {
        padding-left: 4px;
        padding-right: 4px;
      }
    }
  </style>
</head>
<body class="gaming-theme">
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../index.html">

    <main>

      </div>

      <!-- Controls -->

              <option value="default">Standard</option>
            </select>
            <button id="dataset-calendar-toggle" class="tr-calendar-toggle" type="button" aria-expanded="false" aria-controls="dataset-calendar-panel">
              <span class="tr-calendar-toggle-main">
                <span class="tr-calendar-value" id="dataset-calendar-value">Standard</span>
                <span class="tr-calendar-meta" id="dataset-calendar-meta">Preisstand auswählen</span>

            <div id="dataset-calendar-panel" class="tr-calendar-panel" role="dialog" aria-label="Preisdaten-Kalender">

                <div id="dataset-calendar-month" class="tr-calendar-month"></div>

              <div id="dataset-calendar-grid" class="tr-calendar-grid"></div>
              <div class="tr-calendar-legend">
                <span><i class="is-dataset"></i><span data-i18n="dataset_timeline_available">Verfuegbarer Tag</span></span>
                <span><i class="is-history"></i><span data-i18n="dataset_timeline_history">Historischer Tag</span></span>
                <span><i class="is-repeat"></i><span data-i18n="dataset_timeline_repeat">Pattern</span></span>

            </div>
          </div>

          <div class="tr-field">
            <label for="ship-select" data-i18n="lbl_ship">Schiff</label>
            <select id="ship-select">
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="tr-field">
            <label for="cargo-input" data-i18n="lbl_cargo">Fracht</label>
            <input type="number" id="cargo-input" value="1" min="1" max="20000">
          </div>

          <div class="tr-field" id="jumps-field">

              <option value="">Loading...</option>

          </div>

    function snapshotFromLegacyPayload(payload) {
      return {
        id: 'default',
        label: t('dataset_default'),
        ships: payload.ships || [],
        systems: annotateDuplicateSystemNames(payload.systems || {}),
        bases: payload.bases || {},
        adjacency: payload.adjacency || {},
        commodities: payload.commodities || {},
        markets: payload.markets || {},
        specialItems: payload.specialItems || {},
        specialMarkets: payload.specialMarkets || {},
        travel: payload.travel || {},
      };
    }

    function normalizeTradePayload(payload) {
      if (payload && payload.datasets && typeof payload.datasets === 'object') {
        const order = Array.isArray(payload.dataset_order) && payload.dataset_order.length
          ? payload.dataset_order.slice()
          : Object.keys(payload.datasets);
        const mapped = Object.create(null);
        order.forEach(id => {
          const entry = payload.datasets[id];
          if (!entry) return;
          mapped[id] = {
            id,
            label: entry.label || entry.name || id,
            cycleDays: entry.cycle_days || null,
            notes: entry.notes || '',
            ships: entry.ships || [],
            systems: annotateDuplicateSystemNames(entry.systems || {}),
            bases: entry.bases || {},
            adjacency: entry.adjacency || {},
            commodities: entry.commodities || {},
            markets: entry.markets || {},
            specialItems: entry.specialItems || {},
            specialMarkets: entry.specialMarkets || {},
            travel: entry.travel || {},
          };
        });
        const selected = payload.default_dataset && mapped[payload.default_dataset]
          ? payload.default_dataset
          : order.find(id => !!mapped[id]) || '';
        return {
          id: payload.id || '',
          name: payload.name || '',
          datasets: mapped,
          datasetOrder: order.filter(id => !!mapped[id]),
          defaultDataset: selected,
        };
      }

      const fallback = snapshotFromLegacyPayload(payload || {});
      return {
        id: payload && payload.id || '',
        name: payload && payload.name || '',
        datasets: { default: fallback },
        datasetOrder: ['default'],
        defaultDataset: 'default',
      };
    }

    function currentDataset() {
      return datasetMap[selectedDatasetId] || null;
    }

    function parseDatasetDate(label) {
      const match = /\((\d{4}-\d{2}-\d{2})\)/.exec(String(label || ''));
      return match ? match[1] : '';
    }

    function isoDateParts(dateText) {
      const parts = String(dateText || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function isoDateText(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function nextIsoDate(dateText) {
      const date = isoDateParts(dateText);
      if (!date) return '';
      date.setDate(date.getDate() + 1);
      return isoDateText(date);
    }

    function previousIsoDate(dateText) {
      const date = isoDateParts(dateText);
      if (!date) return '';
      date.setDate(date.getDate() - 1);
      return isoDateText(date);
    }

    function timeZoneDateParts(date, timeZone) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23',
      }).formatToParts(date);
      const map = Object.create(null);
      parts.forEach(part => {
        if (part.type !== 'literal') map[part.type] = part.value;
      });
      return map;
    }

    function currentBerlinDateText(now) {
      const parts = timeZoneDateParts(now || new Date(), 'Europe/Berlin');
      return parts.year + '-' + parts.month + '-' + parts.day;
    }

    function currentCrossfireTradeDateText(now) {
      if (window.TradeCycle && typeof window.TradeCycle.currentCrossfireTradeDateText === 'function') {
        return window.TradeCycle.currentCrossfireTradeDateText(now || new Date());
      }
      const current = now || new Date();
      const parts = timeZoneDateParts(current, 'Europe/Berlin');
      const berlinDate = parts.year + '-' + parts.month + '-' + parts.day;
      const hour = parseInt(parts.hour, 10);
      return hour < 8 ? previousIsoDate(berlinDate) : berlinDate;
    }

    function timeZoneOffsetMinutes(date, timeZone) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone,
        timeZoneName: 'shortOffset',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23',
      }).formatToParts(date);
      const zoneName = (parts.find(part => part.type === 'timeZoneName') || {}).value || 'GMT+0';
      const match = /(GMT|UTC)([+-]\d{1,2})(?::?(\d{2}))?/.exec(zoneName);
      if (!match) return 0;
      const hours = parseInt(match[2], 10) || 0;
      const minutes = parseInt(match[3] || '0', 10) || 0;
      return hours * 60 + (hours >= 0 ? minutes : -minutes);
    }

    function berlinLocalToUtc(dateText, hour, minute, second) {
      const parts = String(dateText || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      const guess = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], hour, minute, second || 0));
      const offsetMinutes = timeZoneOffsetMinutes(guess, 'Europe/Berlin');
      return new Date(guess.getTime() - offsetMinutes * 60000);
    }

    function nextCrossfireRebootUtc(now) {
      const current = now || new Date();
      let reboot = berlinLocalToUtc(currentBerlinDateText(), 8, 0, 0);
      if (!reboot || reboot <= current) reboot = berlinLocalToUtc(nextIsoDate(currentBerlinDateText()), 8, 0, 0);
      return reboot;
    }

    function formatUtcClock(date) {
      return String(date.getUTCHours()).padStart(2, '0') + ':' + String(date.getUTCMinutes()).padStart(2, '0');
    }

    function formatTimelineText(template, values) {
      return String(template || '').replace(/\{(\w+)\}/g, (_, key) => values[key] != null ? values[key] : '');
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    function monthStartIso(dateText) {
      const date = isoDateParts(dateText);
      if (!date) return '';
      return isoDateText(new Date(date.getFullYear(), date.getMonth(), 1));
    }

    function shiftIsoMonth(monthText, delta) {
      const date = isoDateParts(monthText);
      if (!date) return monthText;
      return isoDateText(new Date(date.getFullYear(), date.getMonth() + delta, 1));
    }

    function formatMonthLabel(monthText) {
      const date = isoDateParts(monthText);
      if (!date) return '';
      return date.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-US', { month: 'long', year: 'numeric' });
    }

    function findDatasetTimelineEntry(datasetId) {
      if (!datasetTimeline || !Array.isArray(datasetTimeline.segments)) return null;
      return datasetTimeline.segments.find(segment => segment.type === 'day' && segment.datasetId === datasetId) || null;

    function updateRebootStatus() {
      if (!rebootStatus || !rebootTitle || !rebootCountdown || !rebootNote || !rebootMessage) return;
      if (currentModId !== 'crossfire') {

        return;
      }
      rebootStatus.classList.add('active');
      const nextReboot = nextCrossfireRebootUtc(new Date());
      rebootTitle.textContent = t('reboot_title');
      rebootCountdown.textContent = formatTimelineText(t('reboot_countdown'), {

      });
      rebootNote.textContent = formatTimelineText(t('reboot_schedule'), {
        utc: formatUtcClock(nextReboot),
      });

      const berlinToday = currentBerlinDateText();
      if (selectedCalendarDate && !hasSelectedDatasetCalendarEntry()) {
        rebootMessage.textContent = selectedCalendarDate >= berlinToday
          ? formatTimelineText(t('reboot_prices_soon'), { date: selectedCalendarDate })

    function calendarCellInfo(dateText) {
      if (!datasetTimeline) return null;
      if (Array.isArray(datasetTimeline.segments)) {
        const exact = datasetTimeline.segments.find(segment => segment.type === 'day' && segment.date === dateText);
        if (exact) return exact;
      }
      if (datasetTimeline.cycle && window.TradeCycle && typeof window.TradeCycle.resolveCycleDataset === 'function') {
        const cycleMatch = window.TradeCycle.resolveCycleDataset(dateText, datasetTimeline.dated || [], datasetTimeline.cycle);
        if (cycleMatch && !cycleMatch.exact) {
          return {
            type: 'cycle',
            date: dateText,
            datasetId: cycleMatch.datasetId,
            label: '',
            hasDataset: true,
            hasHistory: false,
            stateIndex: cycleMatch.phase,
            entryCount: 0,
            repeated: true,
            cycleSourceDate: cycleMatch.datasetDate,
          };
        }
      }
      if (Array.isArray(datasetTimeline.segments)) {
        const future = datasetTimeline.segments.find(segment => segment.type === 'future' && segment.date === dateText);
        if (future) return future;
      }
      if (dateText >= datasetTimeline.firstDate && dateText <= datasetTimeline.lastDate) {
        return { type: 'gap', date: dateText };
      }
      if (currentModId === 'crossfire' && datasetTimeline.lastDate && dateText > datasetTimeline.lastDate) {
        return { type: 'future', date: dateText };
      }
      return null;
    }

    function renderDatasetCalendar() {
      if (!datasetCalendarPanel || !datasetCalendarWeekdays || !datasetCalendarGrid || !datasetCalendarMonthLabel) return;
      if (!datasetTimeline) {
        datasetCalendarMonthLabel.textContent = '';
        datasetCalendarWeekdays.innerHTML = '';
        datasetCalendarGrid.innerHTML = '';
        return;
      }
      if (!datasetCalendarMonth) syncDatasetCalendarMonth();
      datasetCalendarMonthLabel.textContent = formatMonthLabel(datasetCalendarMonth);
      const weekdayLabels = String(t('dataset_calendar_weekdays')).split(',');
      datasetCalendarWeekdays.innerHTML = weekdayLabels.map(label => '<span>' + escHtml(label) + '</span>').join('');

      const monthStart = isoDateParts(datasetCalendarMonth);
      const firstGridDate = new Date(monthStart);
      firstGridDate.setDate(monthStart.getDate() - ((monthStart.getDay() + 6) % 7));
      const html = [];
      for (let index = 0; index < 42; index += 1) {
        const day = new Date(firstGridDate);
        day.setDate(firstGridDate.getDate() + index);
        const iso = isoDateText(day);
        const info = calendarCellInfo(iso);
        const inMonth = day.getMonth() === monthStart.getMonth();
        const classes = ['tr-calendar-day'];
        const title = [iso];
        let tag = 'div';
        let attrs = '';
        if (!inMonth) classes.push('outside');
        if (info && (info.type === 'day' || info.type === 'cycle')) {
          tag = 'button';
          attrs = ' type="button" data-calendar-date="' + escHtml(iso) + '"' + (info.hasDataset ? ' data-dataset-id="' + escHtml(info.datasetId) + '"' : '');
          if (info.hasHistory) classes.push('history');
          if (info.repeated) classes.push('repeat');
          if (info.type === 'cycle' && datasetTimeline.lastDate && iso > datasetTimeline.lastDate) classes.push('future');
          if (iso === selectedCalendarDate) classes.push('selected');
          if (info.datasetId && info.datasetId === datasetTimeline.latestDatasetId) classes.push('latest');
          if (info.type === 'cycle') title.push(formatTimelineText(t('dataset_calendar_cycle'), { date: info.cycleSourceDate }));
          else if (info.hasDataset) title.push(t('dataset_timeline_available'));
          else title.push(t('dataset_timeline_history'));
          if (info.stateIndex != null) title.push('S' + info.stateIndex);
          if (info.repeated) title.push(t('dataset_timeline_repeat'));
        } else if (info && info.type === 'future') {
          if (inMonth) {
            tag = 'button';
            attrs = ' type="button" data-calendar-date="' + escHtml(iso) + '"';
          }
          classes.push('future');
          if (iso === selectedCalendarDate) classes.push('selected');
          title.push(t('dataset_timeline_future'));
        } else if (info && info.type === 'gap') {
          if (inMonth) {
            tag = 'button';
            attrs = ' type="button" data-calendar-date="' + escHtml(iso) + '"';
          }
          classes.push('gap');
          if (iso === selectedCalendarDate) classes.push('selected');
          title.push(t('dataset_timeline_gap'));
        } else {
          classes.push('outside');
        }
        html.push('<' + tag + ' class="' + classes.join(' ') + '" title="' + escHtml(title.join(' · ')) + '"' + attrs + '>' + escHtml(String(day.getDate())) + '</' + tag + '>');
      }
      datasetCalendarGrid.innerHTML = html.join('');
    }

    function normalizePatternHistory(payload) {
      if (!payload || !Array.isArray(payload.days) || !payload.days.length) return null;
      const repeatDates = new Set();
      (payload.repeatGroups || []).forEach(group => {
        if (!Array.isArray(group)) return;
        group.forEach(date => {
          if (date) repeatDates.add(date);
        });
      });
      const days = payload.days
        .filter(day => day && day.date)
        .map(day => ({
          date: day.date,
          stateIndex: typeof day.stateIndex === 'number' ? day.stateIndex : null,
          entryCount: typeof day.entryCount === 'number' ? day.entryCount : 0,
          repeated: repeatDates.has(day.date),
        }))
        .sort((a, b) => a.date.localeCompare(b.date));
      if (!days.length) return null;
      const cycle = payload.cycle && typeof payload.cycle === 'object'
        ? {
          anchorDate: payload.cycle.anchorDate || payload.cycle.anchor_date || '',
          cycleDays: payload.cycle.cycleDays || payload.cycle.cycle_days || 0,
        }
        : null;
      return { days, repeatDates, cycle };
    }

    function buildDatasetTimeline() {
      const dated = (tradePayload.datasetOrder || []).map(id => {
        const dataset = datasetMap[id];
        if (!dataset) return null;
        const date = parseDatasetDate(dataset.label);
        if (!date) return null;
        return { id, date, label: dataset.label };
      }).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
      const historyDays = patternHistory && Array.isArray(patternHistory.days)
        ? patternHistory.days.slice()
        : [];
      if (!dated.length && !historyDays.length) return null;

      const datasetByDate = Object.create(null);
      dated.forEach(item => { datasetByDate[item.date] = item; });
      const historyByDate = Object.create(null);
      historyDays.forEach(item => { historyByDate[item.date] = item; });
      const allDates = Array.from(new Set(
        dated.map(item => item.date).concat(historyDays.map(item => item.date))
      )).sort((a, b) => a.localeCompare(b));
      const segments = [];
      let gapCount = 0;
      for (let index = 0; index < allDates.length; index += 1) {
        const date = allDates[index];
        if (index > 0) {
          const prevDate = isoDateParts(allDates[index - 1]);
          const currentDate = isoDateParts(date);
          const gapDays = Math.round((currentDate - prevDate) / 86400000) - 1;
          if (gapDays > 0) {
            gapCount += 1;
            const gapStart = new Date(prevDate);
            gapStart.setDate(gapStart.getDate() + 1);
            const gapEnd = new Date(currentDate);
            gapEnd.setDate(gapEnd.getDate() - 1);
            segments.push({
              type: 'gap',
              startDate: isoDateText(gapStart),
              endDate: isoDateText(gapEnd),
              gapDays,
            });
          }
        }
        const dataset = datasetByDate[date];
        const history = historyByDate[date];
        segments.push({
          type: 'day',
          date,
          datasetId: dataset ? dataset.id : '',
          label: dataset ? dataset.label : '',
          hasDataset: !!dataset,
          hasHistory: !!history,
          stateIndex: history ? history.stateIndex : null,
          entryCount: history ? history.entryCount : 0,
          repeated: !!(history && history.repeated),
        });
      }
      const lastDate = allDates[allDates.length - 1];
      segments.push({ type: 'future', date: nextIsoDate(lastDate) });
      const fallbackCycle = window.TradeCycle && window.TradeCycle.DEFAULT_CROSSFIRE_CYCLE
        ? window.TradeCycle.DEFAULT_CROSSFIRE_CYCLE
        : null;
      const cycle = currentModId === 'crossfire'
        ? ((patternHistory && patternHistory.cycle) || fallbackCycle)
        : null;
      return {
        firstDate: allDates[0],
        lastDate,
        latestDatasetId: dated.length ? dated[dated.length - 1].id : '',
        dated,
        historyDays,
        segments,
        gapCount,
        repeatCount: patternHistory ? patternHistory.repeatDates.size : 0,
        cycle,
      };
    }

    function populateDatasetOptions() {
      const options = (tradePayload.datasetOrder || []).map(id => {
        const dataset = datasetMap[id];
        if (!dataset) return '';
        let label = dataset.label || id;
        if (dataset.cycleDays) label += ' [' + dataset.cycleDays + 'd]';
        return '<option value="' + escHtml(id) + '">' + escHtml(label) + '</option>';
      }).join('');
      datasetSelect.innerHTML = options || '<option value="default">' + escHtml(t('dataset_default')) + '</option>';
      if (!selectedDatasetId || !datasetMap[selectedDatasetId]) {
        selectedDatasetId = tradePayload.defaultDataset || tradePayload.datasetOrder[0] || 'default';
      }
      datasetSelect.value = selectedDatasetId;
      datasetSelect.disabled = (tradePayload.datasetOrder || []).length <= 1;
      datasetTimeline = buildDatasetTimeline();
      applyDefaultCalendarDate();
      syncDatasetCalendarMonth();
      updateDatasetCalendarButton();
      renderDatasetCalendar();
      updateRebootStatus();
    }

    function baseHasBuyableCommodity(data, baseNick) {
      if (!baseNick || String(baseNick).includes('_miner')) return false;
      const markets = (data && data.markets) || {};
      return Object.values(markets).some(entries =>
        Array.isArray(entries) && entries.some(entry => entry && entry.base === baseNick && entry.src)
      );
    }

    function syncCurrentBaseInputFromSelect() {
      currentBaseInput.value = currentBaseLabels[currentBaseSelect.value] || '';
    }

    function syncCurrentBaseSelectFromInput() {
      const raw = String(currentBaseInput.value || '').trim();
      if (!raw) {
        currentBaseSelect.value = '';
        return false;
      }

      const exact = currentBaseNicksByLabel[raw];
      if (exact) {
        currentBaseSelect.value = exact;
        return true;
      }

      const normalized = raw.toLowerCase();
      const entries = Object.entries(currentBaseLabels);
      const caseMatch = entries.find(([, label]) => String(label).toLowerCase() === normalized);
      const partialMatch = caseMatch || entries.find(([, label]) => String(label).toLowerCase().includes(normalized));
      if (!partialMatch) {
        currentBaseSelect.value = '';
        return false;
      }

      currentBaseSelect.value = partialMatch[0];
      currentBaseInput.value = partialMatch[1];
      return true;
    }

    function syncCurrentBaseSelectFromExactInput() {
      const raw = String(currentBaseInput.value || '').trim();
      if (!raw) {
        currentBaseSelect.value = '';
        return false;
      }
      const exact = currentBaseNicksByLabel[raw];
      if (!exact) {
        currentBaseSelect.value = '';
        return false;
      }
      currentBaseSelect.value = exact;
      return true;
    }

    function applyDataset(datasetId) {
      const prevStartSystem = startSystemSelect.value;
      const prevTargetSystem = targetSystemSelect.value;
      const prevCurrentBase = currentBaseSelect.value;
      const prevShip = shipSelect.value;
      const prevCargo = cargoInput.value;
      selectedDatasetId = datasetId;
      const entry = findDatasetTimelineEntry(datasetId);
      if (entry && entry.date && !selectedCalendarDate) selectedCalendarDate = entry.date;
      syncDatasetCalendarMonth();
      const data = currentDataset();
      engine = data ? new TradeEngine(data) : null;
      closeCommodityModal();
      closeItemModal();

      if (!data) {
        calcBtn.disabled = true;
        return;
      }

      updateDatasetCalendarButton();
      renderDatasetCalendar();
  updateRebootStatus();

      const systemEntries = Object.entries(data.systems || {})
        .sort((a, b) => String(a[1] || a[0]).localeCompare(String(b[1] || b[0])));
      const systemOptions = systemEntries.map(([nick, name]) =>
        '<option value="' + escHtml(nick) + '">' + escHtml(name || nick) + '</option>'
      ).join('');
      startSystemSelect.innerHTML = '<option value=""></option>' + systemOptions;
      targetSystemSelect.innerHTML = '<option value=""></option>' + systemOptions;
      if (prevStartSystem && data.systems && data.systems[prevStartSystem]) {
        startSystemSelect.value = prevStartSystem;
      } else if (systemEntries.length) {
        startSystemSelect.value = systemEntries[0][0];
      }
      if (prevTargetSystem && data.systems && data.systems[prevTargetSystem]) {
        targetSystemSelect.value = prevTargetSystem;
      } else if (systemEntries.length) {
        targetSystemSelect.value = systemEntries[Math.min(1, systemEntries.length - 1)][0];
      }

      const baseEntries = Object.entries(data.bases || {})
        .filter(([nick]) => baseHasBuyableCommodity(data, nick))
        .sort((a, b) => {
          const leftSystem = data.systems[a[1].sys] || a[1].sys || '';
          const rightSystem = data.systems[b[1].sys] || b[1].sys || '';
          return String(leftSystem).localeCompare(String(rightSystem)) ||
            String(a[1].name || a[0]).localeCompare(String(b[1].name || b[0]));
        });
      currentBaseLabels = Object.create(null);
      currentBaseNicksByLabel = Object.create(null);
      const baseOptions = baseEntries.map(([nick, base]) => {
        const systemName = data.systems[base.sys] || base.sys || '';
        let label = (tBase(nick, base.name || nick) || nick) + (systemName ? ' (' + systemName + ')' : '');
        if (currentBaseNicksByLabel[label]) label += ' [' + nick + ']';
        currentBaseLabels[nick] = label;
        currentBaseNicksByLabel[label] = nick;
        return { nick, label };
      });
      currentBaseSelect.innerHTML = baseEntries.length
        ? baseOptions.map(option => '<option value="' + escHtml(option.nick) + '">' + escHtml(option.label) + '</option>').join('')
        : '<option value=""></option>';
      currentBaseList.innerHTML = baseOptions.map(option => '<option value="' + escHtml(option.label) + '"></option>').join('');
      if (prevCurrentBase && data.bases && data.bases[prevCurrentBase] && baseHasBuyableCommodity(data, prevCurrentBase)) {
        currentBaseSelect.value = prevCurrentBase;
      } else if (baseEntries.length) {
        currentBaseSelect.value = baseEntries[0][0];
      }
      syncCurrentBaseInputFromSelect();

      shipSelect.innerHTML = '';
      const cOpt = document.createElement('option');
      cOpt.value = 'custom';
      cOpt.textContent = t('custom_cargo');
      shipSelect.appendChild(cOpt);

      for (const ship of (data.ships || [])) {
        if (!ship.dealers || ship.dealers.length === 0) continue;
        const opt = document.createElement('option');
        opt.value = ship.cargo;
        opt.textContent = tShip(ship) + '  [' + ship.cargo + ']';
        shipSelect.appendChild(opt);
      }
      const buyableShips = (data.ships || []).filter(s => s.dealers && s.dealers.length > 0);
      const savedShip = persistedShipSelection && persistedShipSelection.value;
      if (prevShip && Array.from(shipSelect.options).some(opt => opt.value === prevShip)) {
        shipSelect.value = prevShip;
      } else if (savedShip && Array.from(shipSelect.options).some(opt => opt.value === savedShip)) {
        shipSelect.value = savedShip;
      } else if (savedShip === 'custom') {
        shipSelect.value = 'custom';
      } else if (buyableShips.length) {
        shipSelect.value = buyableShips[0].cargo;
      } else {
        shipSelect.value = 'custom';
      }

      if (shipSelect.value === 'custom') {
        cargoInput.value = prevCargo || (persistedShipSelection && persistedShipSelection.cargo) || cargoInput.value;
      } else {
        cargoInput.value = shipSelect.value;
      }

      saveShipSelection();

      calcBtn.disabled = false;
    }

    function buildPodRoutes(cargo, maxJumps, includeReturnTrip) {
      const jumpLimit = maxJumps > 0 ? maxJumps : Number.POSITIVE_INFINITY;
      if (engine && engine.data && engine.data.specialItems && Object.keys(engine.data.specialItems).length) {
        return Object.entries(engine.data.specialItems).flatMap(([itemNick, meta]) => {
          const offers = ((engine.data.specialMarkets && engine.data.specialMarkets[itemNick]) || []).slice();
          if (!offers.length) return [];
          const volume = Math.max(1, Math.round(meta.volume || 1));
          const units = Math.floor(cargo / volume);
          if (units <= 0) return [];
          return offers.map(buyOffer => {
            const candidates = offers.map(sellOffer => {
              if (sellOffer.base === buyOffer.base) return null;
              const pathNicks = engine.findPath(buyOffer.sys, sellOffer.sys);
              if (!pathNicks.length) return null;
              const jumps = Math.max(0, pathNicks.length - 1);
              if (jumps > jumpLimit) return null;
              const sellPrice = Math.round(sellOffer.resalePrice != null
                ? sellOffer.resalePrice
                : (sellOffer.price || 0) * (sellOffer.resaleMultiplier || meta.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR));
              const buyPrice = Math.round(buyOffer.price || 0);
              const profitPerUnit = sellPrice - buyPrice;
              if (profitPerUnit <= 0) return null;
              return {
                sellOffer,
                pathNicks,
                jumps,
                sellPrice,
                buyPrice,
                profitPerUnit,
                totalProfit: profitPerUnit * units,
              };
            }).filter(Boolean);
            const bestSell = candidates.sort((a, b) =>
              b.totalProfit - a.totalProfit ||
              b.profitPerUnit - a.profitPerUnit ||
              a.jumps - b.jumps
            )[0];
            if (!bestSell) return null;
            return {
              itemNick,
              item: tItem(itemNick, meta.name || itemNick),
              srcSys: engine.data.systems[buyOffer.sys] || buyOffer.sys,
              srcSysNick: buyOffer.sys,
              buyBase: tBase(buyOffer.base, (engine.data.bases[buyOffer.base] || {}).name || buyOffer.base),
              buyBaseNick: buyOffer.base,
              dstSys: engine.data.systems[bestSell.sellOffer.sys] || bestSell.sellOffer.sys,
              dstSysNick: bestSell.sellOffer.sys,
              sellBase: tBase(bestSell.sellOffer.base, (engine.data.bases[bestSell.sellOffer.base] || {}).name || bestSell.sellOffer.base),
              sellBaseNick: bestSell.sellOffer.base,
              buyPrice: bestSell.buyPrice,
              sellPrice: bestSell.sellPrice,
              marketFactor: Number(bestSell.sellOffer.multiplier || 1),
              resaleFactor: Number(bestSell.sellOffer.resaleMultiplier || meta.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR),
              profitPerUnit: bestSell.profitPerUnit,
              units,
              volume,
              totalProfit: bestSell.totalProfit,
              jumps: bestSell.jumps,
              pathNicks: bestSell.pathNicks,
            };
          }).filter(route => route && route.profitPerUnit > 0);
        });
      }

      if (currentModId !== 'crossfire') return [];
      return POD_ROUTES.flatMap(route => {
        const units = Math.floor(cargo / route.volume);
        if (units <= 0) return [];
        const sellPrice = Math.round(route.sellPrice * SPECIAL_ITEM_RESALE_FACTOR);
        const profitPerUnit = sellPrice - route.buyPrice;
        return route.buyLocations.map(location => {
          const srcSys = location.name || 'Various';
          const buyBase = location.base || '';
          const pathNicks = engine && location.sys && route.sellSystemNick ? engine.findPath(location.sys, route.sellSystemNick) : [];
          if (!pathNicks.length) return null;
          const jumps = Math.max(0, pathNicks.length - 1);
          if (jumps > jumpLimit) return null;
          return {
            item: route.item,
            itemNick: '',
            srcSys,
            srcSysNick: location.sys,
            buyBase,
            buyBaseNick: location.baseNick || '',
            dstSys: route.sellSystem,
            dstSysNick: route.sellSystemNick,
            sellBase: route.sellBase,
            sellBaseNick: route.sellBaseNick || '',
            buyPrice: route.buyPrice,
            sellPrice,
            marketFactor: Math.round(route.sellPrice / route.buyPrice),
            resaleFactor: SPECIAL_ITEM_RESALE_FACTOR,
            profitPerUnit,
            units,
            volume: route.volume,
            totalProfit: profitPerUnit * units,
            jumps,
            pathNicks,
          };
        }).filter(Boolean);
      }).filter(route => route.profitPerUnit > 0);
    }

    function updateModeTabs() {
      const hasSpecialItems = !!(engine && engine.data && engine.data.specialItems && Object.keys(engine.data.specialItems).length);
      const showFallback = currentModId === 'crossfire';
      const tlOnlyWrap = tlOnlyCheck.closest('.tr-check');
      if (podsTab) podsTab.style.display = (hasSpecialItems || showFallback) ? '' : 'none';
      if (!(hasSpecialItems || showFallback) && currentMode === 'pods') {
        currentMode = 'system';
        document.querySelectorAll('.tr-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === currentMode));
      }
      jumpsField.style.display = currentMode === 'journey' ? 'none' : '';
      legsField.style.display = currentMode === 'loop' ? '' : 'none';
      startSystemField.style.display = currentMode === 'journey' ? '' : 'none';
      targetSystemField.style.display = currentMode === 'journey' ? '' : 'none';
      currentBaseField.style.display = currentMode === 'base' ? '' : 'none';
      returnFlightWrap.style.display = currentMode === 'system' ? '' : 'none';
      if (tlOnlyWrap) tlOnlyWrap.style.display = currentMode === 'pods' ? 'none' : '';
    }

    /* ── Mod Loading ───────────────────────────────────── */
    async function loadMod(modId) {
      currentModId = modId;
      engine = null;
      tradePayload = null;
      datasetMap = Object.create(null);
      selectedDatasetId = '';
      datasetTimeline = null;
      patternHistory = null;
      selectedCalendarDate = '';
      factionNames = Object.create(null);
      let shouldAutoCalculate = false;
      closeCommodityModal();
      closeItemModal();
      calcBtn.disabled = true;
      resultsSection.style.display = 'none';
      loading.style.display = 'flex';
      try {
        const resp = await fetch('../data/trade-routes/' + modId + '.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        tradePayload = normalizeTradePayload(await resp.json());
        datasetMap = tradePayload.datasets || Object.create(null);
        try {
          const repResp = await fetch('../data/reputation/' + modId + '.json');
          if (repResp.ok) {
            const repData = await repResp.json();
            for (const faction of (repData.factions || [])) {
              if (faction && faction.nick) factionNames[faction.nick] = faction;
            }
          }
        } catch (e) {}
        try {
          const historyResp = await fetch('../data/price-pattern/' + modId + '-cycle.json');
          if (historyResp.ok) {
            patternHistory = normalizePatternHistory(await historyResp.json());
          }
        } catch (e) {}

        populateDatasetOptions();
        applyDataset(selectedDatasetId);
        updateModeTabs();
        shouldAutoCalculate = !!engine;
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="99" class="tr-empty">' + escHtml(t('load_fail')) +
          escHtml(err.message) + '</td></tr>';
        resultsSection.style.display = '';
      } finally {
        loading.style.display = 'none';
      }
      if (shouldAutoCalculate) calculate();
    }

    /* ── Calculation ───────────────────────────────────── */
    function calculate() {
      if (!engine) return;
      const cargo = Math.max(1, parseInt(cargoInput.value) || 1);
      const jumps = Math.max(0, parseInt(jumpsInput.value) || 0);
      const legs  = Math.max(3, Math.min(6, parseInt(legsInput.value) || 3));
      const startSystem = startSystemSelect.value;
      const targetSystem = targetSystemSelect.value;
      if (currentMode === 'base') syncCurrentBaseSelectFromInput();
      const currentBase = currentBaseSelect.value;
      const includeReturnFlight = returnFlightCheck.checked && currentMode === 'system';
      visibleResultsCount = RESULTS_PAGE_SIZE;

      loading.style.display = 'flex';
      resultsSection.style.display = 'none';

      setTimeout(() => {
        try {
          if (currentModId === 'crossfire' && selectedCalendarDate && !hasSelectedDatasetCalendarEntry()) {
            currentEmptyKey = selectedCalendarDate >= currentCrossfireTradeDateText() ? 'no_prices_soon' : 'no_prices_for_day';
            currentResults = [];
            sortCol = -1;
            renderResults();
            resultsSection.style.display = '';
            updateRebootStatus();
            return;
          }
          const tlOnly = tlOnlyCheck.checked;
          currentEmptyKey = 'no_routes';
          currentJourneyPath = [];
          if (currentMode === 'system') {
                 currentResults = engine.bestRoutesBySystem(cargo, jumps, tlOnly, includeReturnFlight);
          } else if (currentMode === 'base') {
            if (!currentBase) {
              currentEmptyKey = 'no_base';
              currentResults = [];
            } else {
              currentResults = engine.routesFromBase(cargo, currentBase, jumps, tlOnly);
            }
          } else if (currentMode === 'pods') {
            const hasSpecialItems = !!(engine.data.specialItems && Object.keys(engine.data.specialItems).length);
            if (!hasSpecialItems && currentModId === 'crossfire' && cargo < 400) {
              currentEmptyKey = 'no_pod_capacity';
              currentResults = [];
            } else {
              currentResults = buildPodRoutes(cargo, jumps, false);
              engine._applyTravelMetrics(currentResults, false);
            }
          } else if (currentMode === 'journey') {
            currentJourneyPath = engine.findPath(startSystem, targetSystem);
            if (!currentJourneyPath.length) {
              currentEmptyKey = 'no_path';
              currentResults = [];
            } else {
              currentResults = engine.routesAlongJourney(cargo, startSystem, targetSystem, tlOnly);
            }
          } else {
            currentResults = engine.roundTrips(cargo, jumps, legs, 50, tlOnly);
          }
          sortCol = -1;
          // Default sort: $/Min descending, or total profit for market items
          const cols = getCols();
          for (let i = 0; i < cols.length; i++) {
            if (currentMode === 'pods' && cols[i].key === 'totalProfit') { sortCol = i; sortAsc = false; break; }
            if (currentMode === 'base') { sortCol = -1; sortAsc = false; break; }
            if (currentMode !== 'pods' && cols[i].key === 'profitPerMin') { sortCol = i; sortAsc = false; break; }
          }
          renderResults();
          resultsSection.style.display = '';
        } finally {
          loading.style.display = 'none';
        }
      }, 30);
    }

    function commodityButtonHtml(raw, label) {
      if (!raw) return escHtml(label);
      return '<button type="button" class="tr-commodity-btn" data-commodity="' + escHtml(raw) + '">' +
        escHtml(label) + '</button>';
    }

    function itemButtonHtml(raw, label) {
      if (!raw) return escHtml(label);
      return '<button type="button" class="tr-commodity-btn" data-item="' + escHtml(raw) + '">' +
        escHtml(label) + '</button>';
    }

    function getCommodityNickByName(name) {
      if (!engine || !engine.data || !engine.data.commodities) return '';
      for (const [nick, info] of Object.entries(engine.data.commodities)) {
        if (info && info.name === name) return nick;
      }
      return '';
    }

    function getCommodityRows(commodityNick) {
      if (!engine || !commodityNick) return [];
      const entries = (engine.data.markets && engine.data.markets[commodityNick]) || [];
      return entries.map(entry => {
        const base = engine.data.bases[entry.base] || {};
        const systemName = engine.data.systems[entry.sys] || entry.sys;
        const baseName = tBase(entry.base, base.name || entry.base);
        return {
          system: systemName,
          base: baseName,
          faction: base.faction || '',
          buyPrice: entry.src ? Math.round(entry.price) : null,
          sellPrice: entry.src ? null : Math.round(entry.price),
          role: entry.src ? 'sell' : 'buy',
        };
      }).sort((a, b) =>
        (b.sellPrice ?? -1) - (a.sellPrice ?? -1) ||
        (a.buyPrice ?? Number.MAX_SAFE_INTEGER) - (b.buyPrice ?? Number.MAX_SAFE_INTEGER) ||
        (a.system + ' -> ' + a.base).localeCompare(b.system + ' -> ' + b.base)
      );
    }

    function getItemResaleMultiplier(itemNick, entry) {
      const info = (engine && engine.data && engine.data.specialItems && engine.data.specialItems[itemNick]) || {};
      const value = Number((entry && entry.resaleMultiplier) || info.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR);
      return value > 0 ? value : SPECIAL_ITEM_RESALE_FACTOR;
    }

    function getSpecialItemRows(itemNick) {
      if (!engine || !itemNick) return [];
      const entries = (engine.data.specialMarkets && engine.data.specialMarkets[itemNick]) || [];
      return entries.map(entry => {
        const base = engine.data.bases[entry.base] || {};
        const systemName = engine.data.systems[entry.sys] || entry.sys;
        const baseName = tBase(entry.base, base.name || entry.base);
        const resaleMultiplier = getItemResaleMultiplier(itemNick, entry);
        return {
          system: systemName,
          base: baseName,
          faction: base.faction || '',
          buyPrice: Math.round(entry.price),
          sellPrice: Math.round(entry.resalePrice != null ? entry.resalePrice : (entry.price || 0) * resaleMultiplier),
          multiplier: entry.multiplier || 1,
          resaleMultiplier,
        };
      }).sort((a, b) =>
        a.buyPrice - b.buyPrice ||
        (a.system + ' -> ' + a.base).localeCompare(b.system + ' -> ' + b.base)
      );
    }

    function renderCommodityModal() {
      if (!engine || !activeCommodityNick) return;
      const info = engine.data.commodities[activeCommodityNick];
      if (!info) return;

      const query = commodityFilterInput.value.toLowerCase().trim();

          row.system.toLowerCase().includes(query) ||
          row.base.toLowerCase().includes(query) ||

          '<td class="td-num">' + escHtml(row.buyPrice != null ? fmt(row.buyPrice) : '-') + '</td>' +

      { key: 'srcSys',       label: t('col_srcSys') },
      { key: 'buyBase',      label: t('col_buyBase'), format: (v, r) => tBase(r.buyBaseNick, v), html: (v, r) => baseCellHtml(tBase(r.buyBaseNick, v), r.srcSys) },
