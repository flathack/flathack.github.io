      { key: 'commodity',    label: t('col_commodity'), priority: 2, format: v => tCommodity(v), html: (v, r) => commodityButtonHtml(getCommodityNickByName(v), tCommodity(v)) },
      { key: 'buyPrice',     label: t('col_buyPrice'),   priority: 5, cls: 'td-num' },
      { key: 'sellPrice',    label: t('col_sellPrice'),  priority: 5, cls: 'td-num' },
      { key: 'profitPerUnit',label: t('col_profitUnit'), priority: 4, cls: 'td-num td-profit' },
      { key: 'totalProfit',  label: t('col_totalProfit'),priority: 3, cls: 'td-num td-profit' },
      { key: 'jumps',        label: t('col_jumps'),      priority: 4, cls: 'td-num td-jumps' },
      { key: 'travelTime',   label: t('col_time'),       priority: 3, cls: 'td-num td-time', format: v => fmtTime(v) },
      { key: 'profitPerMin', label: t('col_ppm'),        cls: 'td-num td-ppm', format: v => v != null ? fmt(v) : '-' },
    ]; }

    function colsLoop() { return [
      { key: 'routeText',    label: t('col_route') },
      { key: 'commodities',  label: t('col_commodities'), priority: 2, format: v => Array.isArray(v) ? v.map(tCommodity).join(', ') : tCommodity(v), html: v => Array.isArray(v) ? v.map(name => commodityButtonHtml(getCommodityNickByName(name), tCommodity(name))).join(', ') : commodityButtonHtml(getCommodityNickByName(v), tCommodity(v)) },
      { key: 'totalProfit',  label: t('col_totalProfit'), priority: 2, cls: 'td-num td-profit' },
      { key: 'totalJumps',   label: t('col_jumps'),       priority: 4, cls: 'td-num td-jumps' },
      { key: 'travelTime',   label: t('col_time'),        priority: 3, cls: 'td-num td-time', format: v => fmtTime(v) },
      { key: 'profitPerMin', label: t('col_ppm'),        cls: 'td-num td-ppm', format: v => v != null ? fmt(v) : '-' },
    ]; }

    function colsJourney() { return colsRoute(); }
    function colsBase() { return [
      { key: 'commodity',    label: t('col_commodity'), priority: 2, format: v => tCommodity(v), html: (v, r) => commodityButtonHtml(getCommodityNickByName(v), tCommodity(v)) },
      { key: 'dstSys',       label: t('col_dstSys') },
      { key: 'sellBase',     label: t('col_sellBase'), format: (v, r) => tBase(r.sellBaseNick, v), html: (v, r) => baseCellHtml(tBase(r.sellBaseNick, v), r.dstSys) },
      { key: 'buyPrice',     label: t('col_buyPrice'),   priority: 5, cls: 'td-num' },
      { key: 'sellPrice',    label: t('col_sellPrice'),  priority: 5, cls: 'td-num' },
      { key: 'profitPerUnit',label: t('col_profitUnit'), priority: 4, cls: 'td-num td-profit' },
      { key: 'totalProfit',  label: t('col_totalProfit'),priority: 3, cls: 'td-num td-profit' },
      { key: 'jumps',        label: t('col_jumps'),      priority: 4, cls: 'td-num td-jumps' },
      { key: 'travelTime',   label: t('col_time'),       priority: 3, cls: 'td-num td-time', format: v => fmtTime(v) },
      { key: 'profitPerMin', label: t('col_ppm'),        cls: 'td-num td-ppm', format: v => v != null ? fmt(v) : '-' },
    ]; }
    function colsPods() { return [
      { key: 'item',         label: t('col_item'), priority: 2, format: (v, r) => tItem(r.itemNick, v), html: (v, r) => itemButtonHtml((engine && engine.data && engine.data.specialItems && engine.data.specialItems[r.itemNick]) ? r.itemNick : '', tItem(r.itemNick, v)) },
      { key: 'srcSys',       label: t('col_srcSys') },
      { key: 'buyBase',      label: t('col_buyBase'), format: (v, r) => r.buyBaseNick ? tBase(r.buyBaseNick, v) : v, html: (v, r) => baseCellHtml(r.buyBaseNick ? tBase(r.buyBaseNick, v) : v, r.srcSys) },
      { key: 'dstSys',       label: t('col_dstSys') },
      { key: 'sellBase',     label: t('col_sellBase'), format: (v, r) => r.sellBaseNick ? tBase(r.sellBaseNick, v) : v, html: (v, r) => baseCellHtml(r.sellBaseNick ? tBase(r.sellBaseNick, v) : v, r.dstSys) },
      { key: 'buyPrice',     label: t('col_buyPrice'), priority: 5, cls: 'td-num' },
      { key: 'sellPrice',    label: t('col_sellPrice'), priority: 5, cls: 'td-num' },
      { key: 'marketFactor', label: t('col_marketFactor'), priority: 5, cls: 'td-num' },
      { key: 'resaleFactor', label: t('col_resaleFactor'), priority: 5, cls: 'td-num' },
      { key: 'profitPerUnit',label: t('col_profitUnit'), priority: 4, cls: 'td-num td-profit' },
      { key: 'units',        label: t('col_units'), priority: 4, cls: 'td-num' },
      { key: 'volume',       label: t('col_volume_unit'), priority: 4, cls: 'td-num' },
      { key: 'totalProfit',  label: t('col_totalProfit'), priority: 3, cls: 'td-num td-profit' },
      { key: 'jumps',        label: t('col_jumps'), priority: 4, cls: 'td-num td-jumps' },
      { key: 'travelTime',   label: t('col_time'), priority: 3, cls: 'td-num td-time', format: v => fmtTime(v) },
      { key: 'profitPerMin', label: t('col_ppm'), cls: 'td-num td-ppm', format: v => v != null ? fmt(v) : '-' },
    ]; }

    function getCols() {
      if (currentMode === 'pods') return colsPods();
      if (currentMode === 'loop') return colsLoop();
      if (currentMode === 'base') return colsBase();
      if (currentMode === 'journey') return colsJourney();
      return colsRoute();
    }

    function renderResults() {
      const cols = getCols();
      const query = searchInput.value.toLowerCase().trim();

      // Header
      tableHead.innerHTML = '<tr>' + cols.map((c, i) => {
        const arrow = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : '';
        return '<th data-col="' + i + '" class="' + colCssClass(c) + '">' + c.label +
          '<span class="sort-arrow">' + arrow + '</span></th>';
      }).join('') + '</tr>';

      // Filter
      let rows = currentResults;
      if (query) {
        rows = rows.filter(r => {
          const text = cols.map(c => {
            const v = r[c.key];
            return c.format ? c.format(v, r) : (typeof v === 'number' ? fmt(v) : String(v || ''));
          }).join(' ').toLowerCase();
          return text.includes(query);
        });
      }

      // Sort
      if (sortCol >= 0 && sortCol < cols.length) {
        const key = cols[sortCol].key;
        rows = rows.slice().sort((a, b) => {
          let va = a[key], vb = b[key];
          // null/undefined always sort to bottom
          if (va == null && vb == null) return 0;
          if (va == null) return 1;
          if (vb == null) return -1;
          if (Array.isArray(va)) va = va.join(', ');
          if (Array.isArray(vb)) vb = vb.join(', ');
          if (typeof va === 'number' && typeof vb === 'number') {
            return sortAsc ? va - vb : vb - va;
          }
          va = String(va || ''); vb = String(vb || '');
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }

      const visibleRows = rows.slice(0, visibleResultsCount);

      // Stats
      if (currentMode === 'loop') {
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>';
      } else if (currentMode === 'pods') {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>';
      } else if (currentMode === 'journey') {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        const pathText = currentJourneyPath.length
          ? currentJourneyPath.map(sysNick => engine.data.systems[sysNick] || sysNick).join(' \u2192 ')
          : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>' +
          '<span>' + t('stats_path') + ': <strong>' + pathText + '</strong></span>';
      } else if (currentMode === 'base') {
        const bestPpm = rows.reduce((best, route) => Math.max(best, route.profitPerMin || 0), 0);
        const baseText = currentBaseSelect.selectedOptions && currentBaseSelect.selectedOptions[0]
          ? currentBaseSelect.selectedOptions[0].textContent
          : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_base') + ': <strong>' + escHtml(baseText || '-') + '</strong></span>' +
          '<span>' + t('col_ppm') + ': <strong>' + (bestPpm ? fmt(bestPpm) : '-') + '</strong></span>';
      } else {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>';
      }

      // Body
      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="' + cols.length + '" class="tr-empty">' + escHtml(t(currentEmptyKey)) + '</td></tr>';
        resultsSummary.textContent = '';
        loadMoreBtn.style.display = 'none';
        return;
      }

      let html = '';
      for (let i = 0; i < visibleRows.length; i++) {
        const r = visibleRows[i];
        const hasPath = currentMode !== 'loop' && (r.path || (Array.isArray(r.pathNicks) && r.pathNicks.length));
        html += '<tr' + (currentMode === 'loop' ? ' class="tr-loop-parent" data-idx="' + i + '"' : (hasPath ? ' class="tr-route-parent" data-idx="' + i + '"' : '')) + '>';
        for (const c of cols) {
          const raw = r[c.key];
          const val = c.format ? c.format(raw, r) : (typeof raw === 'number' ? fmt(raw) : String(raw || ''));
          const inner = c.html ? c.html(raw, r) : escHtml(val);
          const cellClass = colCssClass(c) + (c.cls ? ' ' + c.cls : '');
          html += '<td class="' + cellClass + '">' + inner + '</td>';
        }
        html += '</tr>';

        // Path detail row (hidden, expand on click)
        if (hasPath) {
          html += '<tr class="tr-path-row" data-parent="' + i + '"><td colspan="' + cols.length + '">' +
            renderRoutePathDetails(r) + '</td></tr>';
        }

        // Loop legs (hidden, expand on click)
        if (currentMode === 'loop' && r.legs) {
          html += '<tr class="tr-loop-legs" data-parent="' + i + '"><td colspan="' + cols.length + '">';
          html += '<div class="tr-leg-detail">';
          r.legs.forEach((leg, li) => {
            html += '<div class="tr-leg-row">' +
              '<span class="tr-leg-label">' + t('leg') + ' ' + (li + 1) + '</span>' +
              '<span class="tr-leg-info">' +
                '<span class="leg-commodity">' + commodityButtonHtml(getCommodityNickByName(leg.commodity), tCommodity(leg.commodity)) + '</span> &mdash; ' +
                '<span class="leg-route">' + escHtml(leg.srcSys) + ' (' + escHtml(tBase(leg.buyBaseNick, leg.buyBase)) + ') \u2192 ' +
                escHtml(leg.dstSys) + ' (' + escHtml(tBase(leg.sellBaseNick, leg.sellBase)) + ')</span>' +
                ' <span class="leg-jumps">' + leg.jumps + ' ' + (leg.jumps !== 1 ? t('jump_p') : t('jump_s')) + '</span>' +
                ' <span class="leg-time">' + escHtml(fmtTime(leg.travelTime)) + '</span>' +
              '</span>' +
              '<span class="tr-leg-profit">+' + fmt(leg.totalProfit) + '</span>' +
            '</div>';
          });
          html += '</div></td></tr>';
        }
      }
      tableBody.innerHTML = html;
      resultsSummary.textContent = t('stats_showing') + ': ' + visibleRows.length + ' / ' + rows.length;
      if (visibleRows.length < rows.length) {
        loadMoreBtn.textContent = t('btn_load_more') + ' (' + Math.min(RESULTS_PAGE_SIZE, rows.length - visibleRows.length) + ')';
        loadMoreBtn.style.display = '';
      } else {
        loadMoreBtn.style.display = 'none';
      }
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* ── Events ────────────────────────────────────────── */

    window.addEventListener('mod-change', e => loadMod(e.detail.mod));

    shipSelect.addEventListener('change', () => {
      if (shipSelect.value !== 'custom') {
        cargoInput.value = shipSelect.value;
      }
      saveShipSelection();
    });
    cargoInput.addEventListener('change', () => {
      if (shipSelect.value === 'custom') saveShipSelection();
    });

    calcBtn.addEventListener('click', calculate);
    commodityModalClose.addEventListener('click', closeCommodityModal);
    itemModalClose.addEventListener('click', closeItemModal);
    commodityFilterInput.addEventListener('input', renderCommodityModal);
    commodityRoleFilter.addEventListener('change', renderCommodityModal);
    datasetSelect.addEventListener('change', () => {
      if (!tradePayload) return;
      const entry = findDatasetTimelineEntry(datasetSelect.value);
      if (entry && entry.date) selectedCalendarDate = entry.date;
      applyDataset(datasetSelect.value);
      updateModeTabs();
      if (resultsSection.style.display !== 'none') calculate();
    });
    datasetCalendarToggle.addEventListener('click', () => {
      if (!datasetTimeline) return;
      if (!datasetCalendarOpen) syncDatasetCalendarMonth();
      setDatasetCalendarOpen(!datasetCalendarOpen);
      renderDatasetCalendar();
    });
    datasetCalendarPrev.addEventListener('click', () => {
      if (!datasetTimeline || !datasetCalendarMonth) return;
      datasetCalendarMonth = shiftIsoMonth(datasetCalendarMonth, -1);
      renderDatasetCalendar();
    });
    datasetCalendarNext.addEventListener('click', () => {
      if (!datasetTimeline || !datasetCalendarMonth) return;
      datasetCalendarMonth = shiftIsoMonth(datasetCalendarMonth, 1);
      renderDatasetCalendar();
    });
    datasetCalendarGrid.addEventListener('click', e => {
      const btn = e.target.closest('button[data-calendar-date]');
      if (!btn) return;
      const dateText = btn.dataset.calendarDate;
      const datasetId = btn.dataset.datasetId;
      selectedCalendarDate = dateText || selectedCalendarDate;
      if (!datasetId) {
        updateDatasetCalendarButton();
        renderDatasetCalendar();
        updateRebootStatus();
        setDatasetCalendarOpen(false);
        if (resultsSection.style.display !== 'none') calculate();
        return;
      }
      if (datasetId === selectedDatasetId) {
        updateDatasetCalendarButton();
        renderDatasetCalendar();
        updateRebootStatus();
        setDatasetCalendarOpen(false);
        if (resultsSection.style.display !== 'none') calculate();
        return;
      }
      datasetSelect.value = datasetId;
      applyDataset(datasetId);
      updateModeTabs();
      setDatasetCalendarOpen(false);
      if (resultsSection.style.display !== 'none') calculate();
    });
    returnFlightCheck.addEventListener('change', () => {
      if (resultsSection.style.display !== 'none' && currentMode === 'system') calculate();
    });
    currentBaseInput.addEventListener('input', () => {
      syncCurrentBaseSelectFromExactInput();
    });
    currentBaseInput.addEventListener('change', () => {
      syncCurrentBaseSelectFromInput();
      if (resultsSection.style.display !== 'none' && currentMode === 'base') calculate();
    });
    currentBaseSelect.addEventListener('change', () => {
      syncCurrentBaseInputFromSelect();
      if (resultsSection.style.display !== 'none' && currentMode === 'base') calculate();
    });
    commodityModal.addEventListener('click', e => {
      if (e.target === commodityModal) closeCommodityModal();
    });
    itemModal.addEventListener('click', e => {
      if (e.target === itemModal) closeItemModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && commodityModal.classList.contains('open')) closeCommodityModal();
      if (e.key === 'Escape' && itemModal.classList.contains('open')) closeItemModal();
      if (e.key === 'Escape' && datasetCalendarOpen) setDatasetCalendarOpen(false);
    });
    document.addEventListener('click', e => {
      if (!datasetCalendarOpen) return;
      if (datasetCalendarPanel.contains(e.target) || datasetCalendarToggle.contains(e.target)) return;
      setDatasetCalendarOpen(false);
    });

    document.querySelectorAll('.tr-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (!engine) return;
        document.querySelectorAll('.tr-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        visibleResultsCount = RESULTS_PAGE_SIZE;
        updateModeTabs();
        calculate();
      });
    });

    searchInput.addEventListener('input', () => {
      if (!currentResults.length) return;
      visibleResultsCount = RESULTS_PAGE_SIZE;
      renderResults();
    });

    loadMoreBtn.addEventListener('click', () => {
      visibleResultsCount += RESULTS_PAGE_SIZE;
      renderResults();
    });

    // Column sort
    tableHead.addEventListener('click', e => {
      const th = e.target.closest('th');
      if (!th) return;
      const col = parseInt(th.dataset.col);
      if (isNaN(col)) return;
      if (sortCol === col) { sortAsc = !sortAsc; }
      else { sortCol = col; sortAsc = false; }
      renderResults();
    });

    // Expand/collapse loop legs
    tableBody.addEventListener('click', e => {
      const commodityBtn = e.target.closest('.tr-commodity-btn');
      if (commodityBtn && commodityBtn.dataset.commodity) {
        e.preventDefault();
        e.stopPropagation();
        openCommodityModal(commodityBtn.dataset.commodity);
        return;
      }
      const itemBtn = e.target.closest('.tr-commodity-btn');
      if (itemBtn && itemBtn.dataset.item) {
        e.preventDefault();
        e.stopPropagation();
        openItemModal(itemBtn.dataset.item);
        return;
      }
      const parent = e.target.closest('.tr-loop-parent');
      if (parent) {
        const idx = parent.dataset.idx;
        const legs = tableBody.querySelector('.tr-loop-legs[data-parent="' + idx + '"]');
        if (legs) legs.classList.toggle('open');
        return;
      }
      const routeParent = e.target.closest('.tr-route-parent');
      if (routeParent) {
        const idx = routeParent.dataset.idx;
        const pathRow = tableBody.querySelector('.tr-path-row[data-parent="' + idx + '"]');
        if (pathRow) pathRow.classList.toggle('open');
      }
    });

    // Language toggle (per-page)
    $('lang-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.tr-lang-btn');
      if (!btn || btn.dataset.lang === lang) return;
      lang = btn.dataset.lang;
      try { sessionStorage.setItem('flathack-lang', lang); } catch(e) {}
      applyLang();
    });

    // Global language toggle (from nav bar)
    window.addEventListener('lang-change', e => {
      if (e.detail && e.detail.lang && e.detail.lang !== lang) {
        lang = e.detail.lang;
        applyLang();
      }
    });

    // Apply initial language from session
    if (lang !== 'de') applyLang();

    window.setInterval(updateRebootStatus, 1000);

    /* ── Init ──────────────────────────────────────────── */
  </script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
