<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Route Calculator | Flathack</title>
  <meta name="description" content="Find the most profitable Freelancer trade routes across systems for Hamburg City, Crossfire, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ── Full-width override ───────────────────────────── */
    .site-shell {
      width: calc(100% - 32px);
      max-width: none;
    }

    /* ── Trade Route Controls ──────────────────────────── */
    .tr-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .tr-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tr-field label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .tr-field select,
    .tr-field input[type="number"] {
      background: rgba(4, 14, 23, 0.85);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      min-width: 100px;
      min-height: 34px;
    }
    .tr-field select { min-width: 170px; }
    .tr-field input[type="number"] { width: 80px; }
    .tr-field select:focus,
    .tr-field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 196, 255, 0.15);
    }

    /* ── Tabs ──────────────────────────────────────────── */
    .tr-tabs {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .tr-tab {
      padding: 6px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(7, 16, 29, 0.72);
      color: var(--muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tr-tab:hover { color: var(--text); background: rgba(88, 196, 255, 0.08); }
    .tr-tab.active {
      color: var(--text);
      background: rgba(88, 196, 255, 0.14);
      border-color: rgba(88, 196, 255, 0.3);
    }

    /* ── Stats Bar ────────────────────────────────────── */
    .tr-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .tr-stats strong { color: var(--accent-strong); }
    .tr-results-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .tr-results-summary {
      font-size: 0.84rem;
      color: var(--muted);
    }

    /* ── Search ────────────────────────────────────────── */
    .tr-search {
      width: 100%;
      padding: 7px 14px;
      margin-bottom: 10px;
      background: rgba(4, 14, 23, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .tr-search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .tr-search::placeholder { color: rgba(159, 178, 207, 0.5); }

    /* ── Table ─────────────────────────────────────────── */
    .tr-table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
    }
    .tr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .tr-table th {
      position: sticky;
      top: 0;
      padding: 6px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      background: rgba(8, 20, 34, 0.95);
      border-bottom: 1px solid var(--panel-border);
      cursor: pointer;
      user-select: none;
    }
    .tr-table th:hover { color: var(--text); }
    .tr-table th .sort-arrow { margin-left: 4px; font-size: 0.7rem; }
    .tr-table td {
      padding: 2px 5px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.08);
    }
    .tr-table tbody tr:nth-child(even) { background: rgba(4, 14, 23, 0.35); }
    .tr-table tbody tr:hover { background: rgba(88, 196, 255, 0.06); }

    .td-num { text-align: right; font-family: "IBM Plex Mono", monospace; }
    .td-profit { color: var(--success); font-weight: 600; }
    .td-jumps { color: var(--accent-warm); }
    .tr-table tbody tr.tr-route-parent { cursor: pointer; }
    .tr-path-row { display: none; }
    .tr-path-row.open { display: table-row; }
    .tr-path-row td { padding: 4px 12px 8px; border-bottom: 1px solid rgba(132, 177, 255, 0.08); font-size: 0.84rem; color: var(--muted); }
    .tr-path-summary { margin-bottom: 6px; }
    .tr-path-segments {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .tr-path-segment {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: baseline;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(88, 196, 255, 0.03);
    }
    .tr-path-segment strong { color: var(--accent-strong); }
    .tr-path-segment-time {
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      white-space: nowrap;
    }

    /* ── Round trip legs ───────────────────────────────── */
    .tr-loop-legs {
      display: none;
      padding: 0;
    }
    .tr-loop-legs.open { display: table-row; }
    .tr-loop-legs td {
      padding: 0 8px 5px 9px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.08);
    }
    .tr-leg-detail {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 0.84rem;
      color: var(--muted);
      padding: 6px 0;
    }
    .tr-leg-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .tr-leg-row:nth-child(odd) { background: rgba(88, 196, 255, 0.03); }
    .tr-leg-label { font-weight: 600; color: var(--accent); white-space: nowrap; }
    .tr-leg-info { color: var(--muted); }
    .tr-leg-info .leg-commodity { color: var(--text); font-weight: 500; }
    .tr-leg-info .leg-route { color: var(--muted); }
    .tr-leg-info .leg-jumps { color: var(--accent-warm); font-size: 0.8rem; }
    .tr-leg-info .leg-time { color: var(--accent); font-size: 0.8rem; font-family: "IBM Plex Mono", monospace; }
    .tr-leg-profit { color: var(--success); font-weight: 600; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }

    .tr-commodity-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .tr-commodity-btn:hover { color: var(--text); }

    .tr-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(3, 10, 18, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1200;
    }
    .tr-modal.open { display: flex; }
    .tr-modal-card {
      width: min(1120px, 100%);
      max-height: min(86vh, 900px);
      overflow: auto;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(8, 20, 34, 0.98), rgba(4, 14, 23, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .tr-modal-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 10px;
      border-bottom: 1px solid rgba(132, 177, 255, 0.1);
    }
    .tr-modal-head h3 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }
    .tr-modal-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .tr-modal-close {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .tr-modal-close:hover { background: rgba(88, 196, 255, 0.08); }
    .tr-modal-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 20px 12px;
    }
    .tr-modal-body {
      padding: 0 20px 20px;
    }
    .tr-role-pill {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .tr-role-pill.sell {
      background: rgba(70, 190, 120, 0.12);
      color: #84f0b0;
    }
    .tr-role-pill.buy {
      background: rgba(255, 180, 70, 0.12);
      color: #ffd08c;
    }

    /* ── Loading ───────────────────────────────────────── */
    .tr-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 48px 0;
    }
    .tr-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ───────────────────────────────────── */
    .tr-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* ── Calc button ───────────────────────────────────── */
    .tr-calc-btn {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 16px;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: #04111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      transition: 160ms ease;
    }
    .tr-calc-btn:hover { filter: brightness(1.1); }
    .tr-calc-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Language toggle ─────────────────────────────── */
    .tr-lang-toggle {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      overflow: hidden;
      margin-left: auto;
    }
    .tr-lang-btn {
      padding: 5px 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 160ms ease;
    }
    .tr-lang-btn.active {
      background: rgba(88, 196, 255, 0.14);
      color: var(--text);
    }

    /* ── Checkbox ───────────────────────────────────────── */
    .tr-check {
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: center;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      user-select: none;
    }
    .tr-check input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px; height: 16px;
      cursor: pointer;
    }
    .tr-check:hover { color: var(--text); }

    .td-time { color: var(--accent); }
    .td-ppm { color: #f0c040; font-weight: 600; }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 700px) {
      .tr-controls { flex-direction: column; align-items: stretch; }
      .tr-field select, .tr-field input[type="number"] { min-width: unset; width: 100%; }
      .tr-tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body class="gaming-theme">
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">FH</span>
        <span class="brand-text">Flathack Projects</span>
      </a>
      <nav class="project-top-nav" aria-label="Projekt-Navigation"></nav>
    </header>

    <main>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div>
          <h2 style="margin: 0 0 2px;" data-i18n="title">Handelsrouten-Rechner</h2>
          <p style="color: var(--muted); margin: 0; font-size: 0.88rem;" data-i18n="intro">Finde die profitabelsten Handelsrouten über alle Systeme.</p>
        </div>
        <div class="tr-lang-toggle" id="lang-toggle">
          <button class="tr-lang-btn active" data-lang="de">DE</button>
          <button class="tr-lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <!-- Controls -->
      <section class="page-section" style="margin-bottom: 14px;">
        <div class="tr-controls">
          <div class="tr-field">
            <label for="dataset-select" data-i18n="lbl_dataset">Preisdaten</label>
            <select id="dataset-select">
              <option value="default">Standard</option>
            </select>
          </div>

          <div class="tr-field">
            <label for="ship-select" data-i18n="lbl_ship">Schiff</label>
            <select id="ship-select">
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="tr-field">
            <label for="cargo-input" data-i18n="lbl_cargo">Fracht</label>
            <input type="number" id="cargo-input" value="1" min="1" max="20000">
          </div>

          <div class="tr-field" id="jumps-field">
            <label for="jumps-input" data-i18n="lbl_jumps">Max. Sprünge</label>
            <input type="number" id="jumps-input" value="5" min="0" max="50">
          </div>

          <div class="tr-field" id="legs-field" style="display:none;">
            <label for="legs-input" data-i18n="lbl_legs">Etappen</label>
            <input type="number" id="legs-input" value="3" min="3" max="6">
          </div>

          <div class="tr-field" id="start-system-field" style="display:none;">
            <label for="start-system-select" data-i18n="lbl_start_system">Aktuelles System</label>
            <select id="start-system-select">
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="tr-field" id="target-system-field" style="display:none;">
            <label for="target-system-select" data-i18n="lbl_target_system">Zielsystem</label>
            <select id="target-system-select">
              <option value="">Loading...</option>
            </select>
          </div>

          <label class="tr-check">
            <input type="checkbox" id="tl-only">
            <span data-i18n="lbl_tl_only">Nur Trade-Lane-Basen</span>
          </label>

          <label class="tr-check" id="return-flight-wrap">
            <input type="checkbox" id="return-flight">
            <span data-i18n="lbl_return_flight">Rückflug einberechnen</span>
          </label>

          <button class="tr-calc-btn" id="calc-btn" disabled data-i18n="btn_calc">Berechnen</button>
        </div>

        <div class="tr-tabs">
          <button class="tr-tab active" data-mode="system" data-i18n="tab_system">Handelsrouten</button>
          <button class="tr-tab" data-mode="loop" data-i18n="tab_loop">Rundkurs</button>
          <button class="tr-tab" data-mode="pods" data-i18n="tab_pods" style="display:none;">Markt-Items</button>
          <button class="tr-tab" data-mode="journey" data-i18n="tab_journey">Reiseroute</button>
        </div>
      </section>

      <!-- Results -->
      <section class="page-section" id="results-section" style="display:none;">
        <div class="tr-stats" id="stats-bar"></div>
        <input type="text" id="search-input" class="tr-search" placeholder="Routen durchsuchen...">
        <div class="tr-table-wrap">
          <table class="tr-table" id="results-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="tr-results-footer">
          <div class="tr-results-summary" id="results-summary"></div>
          <button class="tr-calc-btn" id="load-more-btn" type="button" style="display:none;">Mehr laden</button>
        </div>
      </section>

      <!-- Loading -->
      <div class="tr-loading" id="loading">
        <div class="tr-spinner"></div>
        <p data-i18n="loading">Routen werden berechnet...</p>
      </div>

      <div class="tr-modal" id="commodity-modal" aria-hidden="true">
        <div class="tr-modal-card" role="dialog" aria-modal="true" aria-labelledby="commodity-modal-title">
          <div class="tr-modal-head">
            <div>
              <h3 id="commodity-modal-title">Commodity</h3>
              <div class="tr-modal-meta" id="commodity-modal-meta"></div>
            </div>
            <button class="tr-modal-close" id="commodity-modal-close" aria-label="Close">×</button>
          </div>
          <div class="tr-modal-controls">
            <div class="tr-field">
              <label for="commodity-filter-input" data-i18n="commodity_filter">Filter</label>
              <input type="text" id="commodity-filter-input" class="tr-search" style="margin-bottom:0;" placeholder="Filter...">
            </div>
            <div class="tr-field">
              <label for="commodity-role-filter" data-i18n="commodity_role">Typ</label>
              <select id="commodity-role-filter">
                <option value="all">Alle</option>
                <option value="sell">Verkauft</option>
                <option value="buy">Kauft</option>
              </select>
            </div>
          </div>
          <div class="tr-modal-body">
            <div class="tr-table-wrap">
              <table class="tr-table">
                <thead id="commodity-modal-head"></thead>
                <tbody id="commodity-modal-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="tr-modal" id="item-modal" aria-hidden="true">
        <div class="tr-modal-card" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
          <div class="tr-modal-head">
            <div>
              <h3 id="item-modal-title">Item</h3>
              <div class="tr-modal-meta" id="item-modal-meta"></div>
            </div>
            <button class="tr-modal-close" id="item-modal-close" aria-label="Close">×</button>
          </div>
          <div class="tr-modal-body">
            <div class="tr-table-wrap">
              <table class="tr-table">
                <thead id="item-modal-head"></thead>
                <tbody id="item-modal-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

          : Object.keys(payload.datasets);

        order.forEach(id => {

          if (!entry) return;
          mapped[id] = {
            id,
            label: entry.label || entry.name || id,
            cycleDays: entry.cycle_days || null,

            travel: entry.travel || {},
          };
        });
        const selected = payload.default_dataset && mapped[payload.default_dataset]
          ? payload.default_dataset
          : order.find(id => !!mapped[id]) || '';
        return {
          id: payload.id || '',
          name: payload.name || '',
          datasets: mapped,
          datasetOrder: order.filter(id => !!mapped[id]),
          defaultDataset: selected,
        };

      const fallback = snapshotFromLegacyPayload(payload || {});

        targetSystemSelect.value = systemEntries[Math.min(1, systemEntries.length - 1)][0];
      }

      shipSelect.innerHTML = '';
      const cOpt = document.createElement('option');
      cOpt.value = 'custom';
      cOpt.textContent = t('custom_cargo');
      shipSelect.appendChild(cOpt);

      for (const ship of (data.ships || [])) {
        if (!ship.dealers || ship.dealers.length === 0) continue;
        const opt = document.createElement('option');
        opt.value = ship.cargo;
        opt.textContent = tShip(ship) + '  [' + ship.cargo + ']';
        shipSelect.appendChild(opt);
      }
      const buyableShips = (data.ships || []).filter(s => s.dealers && s.dealers.length > 0);
      if (prevShip && Array.from(shipSelect.options).some(opt => opt.value === prevShip)) {
        shipSelect.value = prevShip;
      } else if (buyableShips.length) {
        shipSelect.value = buyableShips[0].cargo;
      } else {
        shipSelect.value = 'custom';
      }

      if (shipSelect.value === 'custom') {
        cargoInput.value = prevCargo || cargoInput.value;
      } else {
        cargoInput.value = shipSelect.value;
      }

      calcBtn.disabled = false;
    }

    function buildPodRoutes(cargo, maxJumps, includeReturnTrip) {
      const jumpLimit = maxJumps > 0 ? maxJumps : Number.POSITIVE_INFINITY;
      if (engine && engine.data && engine.data.specialItems && Object.keys(engine.data.specialItems).length) {
        return Object.entries(engine.data.specialItems).flatMap(([itemNick, meta]) => {
          const offers = ((engine.data.specialMarkets && engine.data.specialMarkets[itemNick]) || []).slice();
          if (!offers.length) return [];
          const volume = Math.max(1, Math.round(meta.volume || 1));
          const units = Math.floor(cargo / volume);
          if (units <= 0) return [];
          return offers.map(buyOffer => {
            const candidates = offers.map(sellOffer => {
              if (sellOffer.base === buyOffer.base) return null;
              const pathNicks = engine.findPath(buyOffer.sys, sellOffer.sys);
              if (!pathNicks.length) return null;
              const jumps = Math.max(0, pathNicks.length - 1);
              if (jumps > jumpLimit) return null;
              const sellPrice = Math.round(sellOffer.resalePrice != null
                ? sellOffer.resalePrice
                : (sellOffer.price || 0) * (sellOffer.resaleMultiplier || meta.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR));
              const buyPrice = Math.round(buyOffer.price || 0);
              const profitPerUnit = sellPrice - buyPrice;
              if (profitPerUnit <= 0) return null;
              return {
                sellOffer,
                pathNicks,
                jumps,
                sellPrice,
                buyPrice,
                profitPerUnit,
                totalProfit: profitPerUnit * units,
              };
            }).filter(Boolean);
            const bestSell = candidates.sort((a, b) =>
              b.totalProfit - a.totalProfit ||
              b.profitPerUnit - a.profitPerUnit ||
              a.jumps - b.jumps
            )[0];
            if (!bestSell) return null;
            return {
              itemNick,
              item: tItem(itemNick, meta.name || itemNick),
              srcSys: engine.data.systems[buyOffer.sys] || buyOffer.sys,
              srcSysNick: buyOffer.sys,
              buyBase: tBase(buyOffer.base, (engine.data.bases[buyOffer.base] || {}).name || buyOffer.base),
              buyBaseNick: buyOffer.base,
              dstSys: engine.data.systems[bestSell.sellOffer.sys] || bestSell.sellOffer.sys,
              dstSysNick: bestSell.sellOffer.sys,
              sellBase: tBase(bestSell.sellOffer.base, (engine.data.bases[bestSell.sellOffer.base] || {}).name || bestSell.sellOffer.base),
              sellBaseNick: bestSell.sellOffer.base,
              buyPrice: bestSell.buyPrice,
              sellPrice: bestSell.sellPrice,
              marketFactor: Number(bestSell.sellOffer.multiplier || 1),
              resaleFactor: Number(bestSell.sellOffer.resaleMultiplier || meta.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR),
              profitPerUnit: bestSell.profitPerUnit,
              units,
              volume,
              totalProfit: bestSell.totalProfit,
              jumps: bestSell.jumps,
              pathNicks: bestSell.pathNicks,
            };
          }).filter(route => route && route.profitPerUnit > 0);
        });
      }

      if (currentModId !== 'crossfire') return [];
      return POD_ROUTES.flatMap(route => {
        const units = Math.floor(cargo / route.volume);
        if (units <= 0) return [];
        const sellPrice = Math.round(route.sellPrice * SPECIAL_ITEM_RESALE_FACTOR);
        const profitPerUnit = sellPrice - route.buyPrice;
        return route.buyLocations.map(location => {
          const srcSys = location.name || 'Various';
          const buyBase = location.base || '';
          const pathNicks = engine && location.sys && route.sellSystemNick ? engine.findPath(location.sys, route.sellSystemNick) : [];
          if (!pathNicks.length) return null;
          const jumps = Math.max(0, pathNicks.length - 1);
          if (jumps > jumpLimit) return null;
          return {
            item: route.item,
            itemNick: '',
            srcSys,
            srcSysNick: location.sys,
            buyBase,
            buyBaseNick: location.baseNick || '',
            dstSys: route.sellSystem,
            dstSysNick: route.sellSystemNick,
            sellBase: route.sellBase,
            sellBaseNick: route.sellBaseNick || '',
            buyPrice: route.buyPrice,
            sellPrice,
            marketFactor: Math.round(route.sellPrice / route.buyPrice),
            resaleFactor: SPECIAL_ITEM_RESALE_FACTOR,
            profitPerUnit,
            units,
            volume: route.volume,
            totalProfit: profitPerUnit * units,
            jumps,
            pathNicks,
          };
        }).filter(Boolean);
      }).filter(route => route.profitPerUnit > 0);
    }

    function updateModeTabs() {
      const hasSpecialItems = !!(engine && engine.data && engine.data.specialItems && Object.keys(engine.data.specialItems).length);
      const showFallback = currentModId === 'crossfire';
      const tlOnlyWrap = tlOnlyCheck.closest('.tr-check');
      if (podsTab) podsTab.style.display = (hasSpecialItems || showFallback) ? '' : 'none';
      if (!(hasSpecialItems || showFallback) && currentMode === 'pods') {
        currentMode = 'system';
        document.querySelectorAll('.tr-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === currentMode));
      }
      jumpsField.style.display = currentMode === 'journey' ? 'none' : '';
      legsField.style.display = currentMode === 'loop' ? '' : 'none';
      startSystemField.style.display = currentMode === 'journey' ? '' : 'none';
      targetSystemField.style.display = currentMode === 'journey' ? '' : 'none';
      returnFlightWrap.style.display = currentMode === 'system' ? '' : 'none';
      if (tlOnlyWrap) tlOnlyWrap.style.display = currentMode === 'pods' ? 'none' : '';
    }

    /* ── Mod Loading ───────────────────────────────────── */
    async function loadMod(modId) {
      currentModId = modId;
      engine = null;
      tradePayload = null;
      datasetMap = Object.create(null);
      selectedDatasetId = '';
      factionNames = Object.create(null);
      let shouldAutoCalculate = false;
      closeCommodityModal();
      closeItemModal();
      calcBtn.disabled = true;
      resultsSection.style.display = 'none';
      loading.style.display = 'flex';
      try {
        const resp = await fetch('../data/trade-routes/' + modId + '.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        tradePayload = normalizeTradePayload(await resp.json());
        datasetMap = tradePayload.datasets || Object.create(null);
        try {
          const repResp = await fetch('../data/reputation/' + modId + '.json');
          if (repResp.ok) {
            const repData = await repResp.json();
            for (const faction of (repData.factions || [])) {
              if (faction && faction.nick) factionNames[faction.nick] = faction;
            }
          }
        } catch (e) {}

        populateDatasetOptions();
        applyDataset(selectedDatasetId);
        updateModeTabs();
        shouldAutoCalculate = !!engine;
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="99" class="tr-empty">' + escHtml(t('load_fail')) +
          escHtml(err.message) + '</td></tr>';
        resultsSection.style.display = '';
      } finally {
        loading.style.display = 'none';
      }
      if (shouldAutoCalculate) calculate();
    }

    /* ── Calculation ───────────────────────────────────── */
    function calculate() {
      if (!engine) return;
      const cargo = Math.max(1, parseInt(cargoInput.value) || 1);
      const jumps = Math.max(0, parseInt(jumpsInput.value) || 0);
      const legs  = Math.max(3, Math.min(6, parseInt(legsInput.value) || 3));
      const startSystem = startSystemSelect.value;
      const targetSystem = targetSystemSelect.value;
      const includeReturnFlight = returnFlightCheck.checked && currentMode === 'system';
      visibleResultsCount = RESULTS_PAGE_SIZE;

      loading.style.display = 'flex';
      resultsSection.style.display = 'none';

      setTimeout(() => {
        try {
          const tlOnly = tlOnlyCheck.checked;
          currentEmptyKey = 'no_routes';
          currentJourneyPath = [];
          if (currentMode === 'system') {
            currentResults = jumps === 0
              ? engine.innerSystemRoutes(cargo, tlOnly, includeReturnFlight)
              : engine.bestRoutesBySystem(cargo, jumps, tlOnly, includeReturnFlight);
          } else if (currentMode === 'pods') {
            const hasSpecialItems = !!(engine.data.specialItems && Object.keys(engine.data.specialItems).length);
            if (!hasSpecialItems && currentModId === 'crossfire' && cargo < 400) {
              currentEmptyKey = 'no_pod_capacity';
              currentResults = [];
            } else {
              currentResults = buildPodRoutes(cargo, jumps, false);
              engine._applyTravelMetrics(currentResults, false);
            }
          } else if (currentMode === 'journey') {
            currentJourneyPath = engine.findPath(startSystem, targetSystem);
            if (!currentJourneyPath.length) {
              currentEmptyKey = 'no_path';
              currentResults = [];
            } else {
              currentResults = engine.routesAlongJourney(cargo, startSystem, targetSystem, tlOnly);
            }
          } else {
            currentResults = engine.roundTrips(cargo, jumps, legs, 50, tlOnly);
          }
          sortCol = -1;
          // Default sort: $/Min descending, or total profit for market items
          const cols = getCols();
          for (let i = 0; i < cols.length; i++) {
            if (currentMode === 'pods' && cols[i].key === 'totalProfit') { sortCol = i; sortAsc = false; break; }
            if (currentMode !== 'pods' && cols[i].key === 'profitPerMin') { sortCol = i; sortAsc = false; break; }
          }
          renderResults();
          resultsSection.style.display = '';
        } finally {
          loading.style.display = 'none';
        }
      }, 30);
    }

    function getCommodityNickByName(name) {
      if (!engine || !engine.data || !engine.data.commodities) return '';
      for (const [nick, info] of Object.entries(engine.data.commodities)) {
        if (info && info.name === name) return nick;
      }
      return '';
    }

    function getCommodityRows(commodityNick) {
      if (!engine || !commodityNick) return [];
      const entries = (engine.data.markets && engine.data.markets[commodityNick]) || [];
      return entries.map(entry => {
        const base = engine.data.bases[entry.base] || {};
        const systemName = engine.data.systems[entry.sys] || entry.sys;
        const baseName = tBase(entry.base, base.name || entry.base);
        return {
          system: systemName,
          base: baseName,
          faction: base.faction || '',
          buyPrice: entry.src ? Math.round(entry.price) : null,
          sellPrice: entry.src ? null : Math.round(entry.price),
          role: entry.src ? 'sell' : 'buy',
        };
      }).sort((a, b) =>
        (b.sellPrice ?? -1) - (a.sellPrice ?? -1) ||
        (a.buyPrice ?? Number.MAX_SAFE_INTEGER) - (b.buyPrice ?? Number.MAX_SAFE_INTEGER) ||
        (a.system + ' -> ' + a.base).localeCompare(b.system + ' -> ' + b.base)
      );
    }

    function getItemResaleMultiplier(itemNick, entry) {
      const info = (engine && engine.data && engine.data.specialItems && engine.data.specialItems[itemNick]) || {};
      const value = Number((entry && entry.resaleMultiplier) || info.resaleMultiplier || SPECIAL_ITEM_RESALE_FACTOR);
      return value > 0 ? value : SPECIAL_ITEM_RESALE_FACTOR;
    }

    function getSpecialItemRows(itemNick) {
      if (!engine || !itemNick) return [];
      const entries = (engine.data.specialMarkets && engine.data.specialMarkets[itemNick]) || [];
      return entries.map(entry => {
        const base = engine.data.bases[entry.base] || {};
        const systemName = engine.data.systems[entry.sys] || entry.sys;
        const baseName = tBase(entry.base, base.name || entry.base);
        const resaleMultiplier = getItemResaleMultiplier(itemNick, entry);
        return {
          system: systemName,
          base: baseName,
          faction: base.faction || '',
          buyPrice: Math.round(entry.price),
          sellPrice: Math.round(entry.resalePrice != null ? entry.resalePrice : (entry.price || 0) * resaleMultiplier),
          multiplier: entry.multiplier || 1,
          resaleMultiplier,
        };
      }).sort((a, b) =>
        a.buyPrice - b.buyPrice ||
        (a.system + ' -> ' + a.base).localeCompare(b.system + ' -> ' + b.base)
      );
    }

      { key: 'totalProfit',  label: t('col_totalProfit'), cls: 'td-num td-profit' },
      { key: 'jumps',        label: t('col_jumps'), cls: 'td-num td-jumps' },
      { key: 'travelTime',   label: t('col_time'), cls: 'td-num td-time', format: v => fmtTime(v) },
      { key: 'profitPerMin', label: t('col_ppm'), cls: 'td-num td-ppm', format: v => v != null ? fmt(v) : '-' },
    ]; }

    function getCols() {
      if (currentMode === 'pods') return colsPods();
      if (currentMode === 'loop') return colsLoop();
      if (currentMode === 'journey') return colsJourney();
      return colsRoute();
    }

    function renderResults() {
      const cols = getCols();
      const query = searchInput.value.toLowerCase().trim();

      // Header
      tableHead.innerHTML = '<tr>' + cols.map((c, i) => {
        const arrow = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : '';
        return '<th data-col="' + i + '">' + c.label +
          '<span class="sort-arrow">' + arrow + '</span></th>';
      }).join('') + '</tr>';

      // Filter
      let rows = currentResults;
      if (query) {
        rows = rows.filter(r => {
          const text = cols.map(c => {
            const v = r[c.key];
            return c.format ? c.format(v, r) : (typeof v === 'number' ? fmt(v) : String(v || ''));
          }).join(' ').toLowerCase();
          return text.includes(query);
        });
      }

      // Sort
      if (sortCol >= 0 && sortCol < cols.length) {
        const key = cols[sortCol].key;
        rows = rows.slice().sort((a, b) => {
          let va = a[key], vb = b[key];
          // null/undefined always sort to bottom
          if (va == null && vb == null) return 0;
          if (va == null) return 1;
          if (vb == null) return -1;
          if (Array.isArray(va)) va = va.join(', ');
          if (Array.isArray(vb)) vb = vb.join(', ');
          if (typeof va === 'number' && typeof vb === 'number') {
            return sortAsc ? va - vb : vb - va;
          }
          va = String(va || ''); vb = String(vb || '');
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }

      const visibleRows = rows.slice(0, visibleResultsCount);

      // Stats
      if (currentMode === 'loop') {
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>';
      } else if (currentMode === 'pods') {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>';
      } else if (currentMode === 'journey') {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        const pathText = currentJourneyPath.length
          ? currentJourneyPath.map(sysNick => engine.data.systems[sysNick] || sysNick).join(' \u2192 ')
          : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>' +
          '<span>' + t('stats_path') + ': <strong>' + pathText + '</strong></span>';
      } else {
        const best = rows.length ? fmt(rows[0].totalProfit) : '-';
        statsBar.innerHTML =
          '<span>' + t('stats_routes') + ': <strong>' + rows.length + '</strong></span>' +
          '<span>' + t('stats_showing') + ': <strong>' + visibleRows.length + ' / ' + rows.length + '</strong></span>' +
          '<span>' + t('stats_best') + ': <strong>' + best + '</strong></span>';
      }

      // Body
      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="' + cols.length + '" class="tr-empty">' + escHtml(t(currentEmptyKey)) + '</td></tr>';
        resultsSummary.textContent = '';
        loadMoreBtn.style.display = 'none';
        return;
      }

      let html = '';
      for (let i = 0; i < visibleRows.length; i++) {
        const r = visibleRows[i];
        const hasPath = currentMode !== 'loop' && (r.path || (Array.isArray(r.pathNicks) && r.pathNicks.length));
        html += '<tr' + (currentMode === 'loop' ? ' class="tr-loop-parent" data-idx="' + i + '"' : (hasPath ? ' class="tr-route-parent" data-idx="' + i + '"' : '')) + '>';
        for (const c of cols) {
          const raw = r[c.key];
          const val = c.format ? c.format(raw, r) : (typeof raw === 'number' ? fmt(raw) : String(raw || ''));
          const inner = c.html ? c.html(raw, r) : escHtml(val);
          html += '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + inner + '</td>';
        }
        html += '</tr>';

        // Path detail row (hidden, expand on click)
        if (hasPath) {
          html += '<tr class="tr-path-row" data-parent="' + i + '"><td colspan="' + cols.length + '">' +
            renderRoutePathDetails(r) + '</td></tr>';
        }

        // Loop legs (hidden, expand on click)
        if (currentMode === 'loop' && r.legs) {
          html += '<tr class="tr-loop-legs" data-parent="' + i + '"><td colspan="' + cols.length + '">';
          html += '<div class="tr-leg-detail">';
          r.legs.forEach((leg, li) => {
            html += '<div class="tr-leg-row">' +
              '<span class="tr-leg-label">' + t('leg') + ' ' + (li + 1) + '</span>' +
              '<span class="tr-leg-info">' +
                '<span class="leg-commodity">' + commodityButtonHtml(getCommodityNickByName(leg.commodity), tCommodity(leg.commodity)) + '</span> &mdash; ' +
                '<span class="leg-route">' + escHtml(leg.srcSys) + ' (' + escHtml(tBase(leg.buyBaseNick, leg.buyBase)) + ') \u2192 ' +
                escHtml(leg.dstSys) + ' (' + escHtml(tBase(leg.sellBaseNick, leg.sellBase)) + ')</span>' +
                ' <span class="leg-jumps">' + leg.jumps + ' ' + (leg.jumps !== 1 ? t('jump_p') : t('jump_s')) + '</span>' +
                ' <span class="leg-time">' + escHtml(fmtTime(leg.travelTime)) + '</span>' +
              '</span>' +
              '<span class="tr-leg-profit">+' + fmt(leg.totalProfit) + '</span>' +
            '</div>';
          });
          html += '</div></td></tr>';
        }
      }
      tableBody.innerHTML = html;
      resultsSummary.textContent = t('stats_showing') + ': ' + visibleRows.length + ' / ' + rows.length;
      if (visibleRows.length < rows.length) {
        loadMoreBtn.textContent = t('btn_load_more') + ' (' + Math.min(RESULTS_PAGE_SIZE, rows.length - visibleRows.length) + ')';
        loadMoreBtn.style.display = '';
      } else {
        loadMoreBtn.style.display = 'none';
      }
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* ── Events ────────────────────────────────────────── */

    window.addEventListener('mod-change', e => loadMod(e.detail.mod));

    shipSelect.addEventListener('change', () => {
      if (shipSelect.value !== 'custom') {
        cargoInput.value = shipSelect.value;
      }
    });

    calcBtn.addEventListener('click', calculate);
    commodityModalClose.addEventListener('click', closeCommodityModal);
    itemModalClose.addEventListener('click', closeItemModal);
    commodityFilterInput.addEventListener('input', renderCommodityModal);
    commodityRoleFilter.addEventListener('change', renderCommodityModal);
    datasetSelect.addEventListener('change', () => {
      if (!tradePayload) return;
      applyDataset(datasetSelect.value);
      updateModeTabs();
      if (resultsSection.style.display !== 'none') calculate();
    });
    returnFlightCheck.addEventListener('change', () => {
      if (resultsSection.style.display !== 'none' && currentMode === 'system') calculate();
    });
    commodityModal.addEventListener('click', e => {
      if (e.target === commodityModal) closeCommodityModal();
    });
    itemModal.addEventListener('click', e => {
      if (e.target === itemModal) closeItemModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && commodityModal.classList.contains('open')) closeCommodityModal();
      if (e.key === 'Escape' && itemModal.classList.contains('open')) closeItemModal();
    });

    document.querySelectorAll('.tr-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (!engine) return;
        document.querySelectorAll('.tr-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        visibleResultsCount = RESULTS_PAGE_SIZE;
        updateModeTabs();
        calculate();
      });
    });

    searchInput.addEventListener('input', () => {
      if (!currentResults.length) return;
      visibleResultsCount = RESULTS_PAGE_SIZE;
      renderResults();
    });

    loadMoreBtn.addEventListener('click', () => {
      visibleResultsCount += RESULTS_PAGE_SIZE;
      renderResults();
    });

    // Column sort
    tableHead.addEventListener('click', e => {
      const th = e.target.closest('th');
      if (!th) return;
      const col = parseInt(th.dataset.col);
      if (isNaN(col)) return;
      if (sortCol === col) { sortAsc = !sortAsc; }
      else { sortCol = col; sortAsc = false; }
      renderResults();
    });

    // Expand/collapse loop legs
    tableBody.addEventListener('click', e => {
      const commodityBtn = e.target.closest('.tr-commodity-btn');
      if (commodityBtn && commodityBtn.dataset.commodity) {
        e.preventDefault();
        e.stopPropagation();
        openCommodityModal(commodityBtn.dataset.commodity);
        return;
      }
      const itemBtn = e.target.closest('.tr-commodity-btn');
      if (itemBtn && itemBtn.dataset.item) {
        e.preventDefault();
        e.stopPropagation();
        openItemModal(itemBtn.dataset.item);
        return;
      }
      const parent = e.target.closest('.tr-loop-parent');
      if (parent) {
        const idx = parent.dataset.idx;
        const legs = tableBody.querySelector('.tr-loop-legs[data-parent="' + idx + '"]');
        if (legs) legs.classList.toggle('open');
        return;
      }
      const routeParent = e.target.closest('.tr-route-parent');
      if (routeParent) {
        const idx = routeParent.dataset.idx;
        const pathRow = tableBody.querySelector('.tr-path-row[data-parent="' + idx + '"]');
        if (pathRow) pathRow.classList.toggle('open');
      }
    });

    // Language toggle (per-page)
    $('lang-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.tr-lang-btn');
      if (!btn || btn.dataset.lang === lang) return;
      lang = btn.dataset.lang;
      try { sessionStorage.setItem('flathack-lang', lang); } catch(e) {}
      applyLang();
    });

    // Global language toggle (from nav bar)
    window.addEventListener('lang-change', e => {
      if (e.detail && e.detail.lang && e.detail.lang !== lang) {
        lang = e.detail.lang;
        applyLang();
      }
    });

    // Apply initial language from session
    if (lang !== 'de') applyLang();

    /* ── Init ──────────────────────────────────────────── */
  </script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
